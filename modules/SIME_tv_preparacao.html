<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIME TV Preparação</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:#fff; color:#000; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; user-select:none; }
body { display:flex; flex-direction:column; }

.bars { padding:18px 52px 0; display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
.bar-row { display:flex; align-items:center; gap:12px; }
.bar-label { font-size:0.65rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#bbb; width:88px; flex-shrink:0; }
.bar-track { flex:1; height:3px; background:#eee; border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; transition:width 0.7s ease; }
.bar-fill.carga { background:#bbb; }
.bar-fill.prep  { background:#888; }
.bar-fill.lacre { background:#111; }
.bar-pct { font-size:0.62rem; font-weight:700; width:34px; text-align:right; flex-shrink:0; }
.bar-pct.carga { color:#bbb; }
.bar-pct.prep  { color:#888; }
.bar-pct.lacre { color:#333; }

.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 40px 16px; }
.data { font-size:clamp(2rem,7.5vw,5.5rem); font-weight:300; color:#999; letter-spacing:0.08em; font-variant-numeric:tabular-nums; line-height:1; margin-bottom:clamp(4px,1.2vh,16px); }
.hora { display:flex; align-items:baseline; line-height:1; }
.hora-hm { font-size:clamp(7rem,28vw,22rem); font-weight:900; color:#000; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
.hora-sep { font-size:clamp(7rem,28vw,22rem); font-weight:900; color:#000; letter-spacing:-0.06em; animation:blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.07} }
.hora-s { font-size:clamp(3.5rem,12vw,9rem); font-weight:700; color:#aaa; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; align-self:flex-end; padding-bottom:clamp(8px,1.8vw,28px); margin-left:clamp(4px,0.5vw,12px); }

.footer { padding:10px 52px 14px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #efefef; flex-shrink:0; }
.f-brand { font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:#ccc; font-weight:700; }
.f-status { font-size:clamp(0.6rem,1vw,0.82rem); color:#ccc; letter-spacing:0.1em; text-transform:uppercase; font-weight:500; }
.f-counts { display:flex; gap:22px; }
.fc { text-align:center; }
.fc-val { font-size:clamp(1rem,1.8vw,1.4rem); font-weight:800; line-height:1; }
.fc-lbl { font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase; margin-top:2px; }
.fc.carga .fc-val { color:#ccc; } .fc.carga .fc-lbl { color:#ccc; }
.fc.prep  .fc-val { color:#aaa; } .fc.prep  .fc-lbl { color:#aaa; }
.fc.lacre .fc-val { color:#444; } .fc.lacre .fc-lbl { color:#888; }
.fc.total .fc-val { color:#ddd; } .fc.total .fc-lbl { color:#ddd; }
</style>
</head>
<body>
<div class="bars">
  <div class="bar-row"><div class="bar-label">Carga</div><div class="bar-track"><div class="bar-fill carga" id="b-carga" style="width:0%"></div></div><div class="bar-pct carga" id="p-carga">0%</div></div>
  <div class="bar-row"><div class="bar-label">Preparação</div><div class="bar-track"><div class="bar-fill prep" id="b-prep" style="width:0%"></div></div><div class="bar-pct prep" id="p-prep">0%</div></div>
  <div class="bar-row"><div class="bar-label">Lacradas</div><div class="bar-track"><div class="bar-fill lacre" id="b-lacre" style="width:0%"></div></div><div class="bar-pct lacre" id="p-lacre">0%</div></div>
</div>
<div class="center">
  <div class="data" id="c-data">00/00/0000</div>
  <div class="hora">
    <span class="hora-hm" id="c-h">00</span>
    <span class="hora-sep">:</span>
    <span class="hora-hm" id="c-m">00</span>
    <span class="hora-sep">:</span>
    <span class="hora-s"  id="c-s">00</span>
  </div>
</div>
<div class="footer">
  <div class="f-brand">SIME TV Preparação · 7ª Zona/PI</div>
  <div class="f-status" id="f-status">—</div>
  <div class="f-counts">
    <div class="fc carga"><div class="fc-val" id="fc-carga">—</div><div class="fc-lbl">Carga</div></div>
    <div class="fc prep"> <div class="fc-val" id="fc-prep">—</div><div class="fc-lbl">Prep.</div></div>
    <div class="fc lacre"><div class="fc-val" id="fc-lacre">—</div><div class="fc-lbl">Lacradas</div></div>
    <div class="fc total"><div class="fc-val" id="fc-total">174</div><div class="fc-lbl">Total</div></div>
  </div>
</div>
<script>
function tick() {
  const n=new Date();
  document.getElementById('c-data').textContent=`${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;
  document.getElementById('c-h').textContent=String(n.getHours()).padStart(2,'0');
  document.getElementById('c-m').textContent=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('c-s').textContent=String(n.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick,1000);

// Total é calculado dinamicamente a partir dos dados do coordenador
// fallback para 174 (7ª Zona/PI) caso não haja dados
function calcTotal(){
  try{ const d=localStorage.getItem('sime_lacre_v3'); if(d){ const t=Object.keys(JSON.parse(d)).length; return t>0?t:174; }}catch(e){} return 174;
}
function updateBars(){
  const TOTAL=calcTotal();
  document.getElementById('fc-total').textContent=TOTAL;
  let c=0,p=0,l=0;
  try{const raw=localStorage.getItem('sime_lacre_v3');if(raw){Object.values(JSON.parse(raw)).forEach(v=>{if(v.carga)c++;if(v.prep)p++;if(v.lacre)l++;});}}catch(e){}
  const pct=v=>Math.round(v/TOTAL*100);
  document.getElementById('b-carga').style.width=pct(c)+'%'; document.getElementById('p-carga').textContent=pct(c)+'%';
  document.getElementById('b-prep').style.width=pct(p)+'%';  document.getElementById('p-prep').textContent=pct(p)+'%';
  document.getElementById('b-lacre').style.width=pct(l)+'%'; document.getElementById('p-lacre').textContent=pct(l)+'%';
  document.getElementById('fc-carga').textContent=c;
  document.getElementById('fc-prep').textContent=p;
  document.getElementById('fc-lacre').textContent=l;
  const f=TOTAL-l;
  document.getElementById('f-status').textContent=l===0&&c===0?'aguardando início':l===TOTAL?'todas lacradas':l>=TOTAL*0.75?`faltam ${f} urna${f>1?'s':''}`:`${l} de ${TOTAL} lacradas`;
}
updateBars(); setInterval(updateBars,3000);
</script>
</body>
</html>
