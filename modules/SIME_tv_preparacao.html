<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIME TV Preparação</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:#fff; color:#000; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; user-select:none; }
body { display:flex; flex-direction:column; }

.bars { padding:18px 52px 0; display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
.bar-row { display:flex; align-items:center; gap:12px; }
.bar-label { font-size:0.65rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#bbb; width:88px; flex-shrink:0; }
.bar-track { flex:1; height:3px; background:#eee; border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; transition:width 0.7s ease; }
.bar-fill.carga { background:#bbb; }
.bar-fill.prep  { background:#888; }
.bar-fill.lacre { background:#111; }
.bar-pct { font-size:0.62rem; font-weight:700; width:34px; text-align:right; flex-shrink:0; }
.bar-pct.carga { color:#bbb; }
.bar-pct.prep  { color:#888; }
.bar-pct.lacre { color:#333; }
/* Estado final ("todas lacradas") ganha destaque de verde — antes a paleta
   inteira ficava em cinza claríssimo, sem nenhum acento mesmo completa
   (achado "alto" da auditoria). Escopado em body.tudo-lacrado pra cobrir as
   barras E os contadores do rodapé com um único toggle. */
body.tudo-lacrado .bar-fill.carga,
body.tudo-lacrado .bar-fill.prep,
body.tudo-lacrado .bar-fill.lacre { background:#0a7a3d; }
body.tudo-lacrado .bar-pct.carga,
body.tudo-lacrado .bar-pct.prep,
body.tudo-lacrado .bar-pct.lacre { color:#0a7a3d; }
body.tudo-lacrado .fc.lacre .fc-val,
body.tudo-lacrado .fc.lacre .fc-lbl { color:#0a7a3d; }

.center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 40px 16px; }
.data { font-size:clamp(1.4rem,5vw,3.2rem); font-weight:300; color:#999; letter-spacing:0.08em; font-variant-numeric:tabular-nums; line-height:1; margin-bottom:clamp(4px,1.2vh,16px); }
.hora { display:flex; align-items:baseline; line-height:1; }
.hora-hm { font-size:clamp(4rem,16vw,11rem); font-weight:900; color:#444; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
.hora-sep { font-size:clamp(4rem,16vw,11rem); font-weight:900; color:#444; letter-spacing:-0.06em; animation:blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.07} }
.hora-s { font-size:clamp(1.8rem,6vw,4.5rem); font-weight:700; color:#aaa; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; align-self:flex-end; padding-bottom:clamp(6px,1vw,16px); margin-left:clamp(4px,0.5vw,12px); }

/* Dado que mais importa (status de carga/preparação/lacre) — antes minúsculo
   e cinza claro no rodapé, atrás de um relógio gigante que domina a tela. */
.status-hero { font-size:clamp(1.6rem,5.5vw,3.6rem); font-weight:800; letter-spacing:0.02em; color:#111; margin-top:clamp(10px,2.5vh,26px); text-align:center; }
.status-hero.done { color:#0a7a3d; }

.footer { padding:10px 52px 14px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #efefef; flex-shrink:0; }
.f-brand { font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:#ccc; font-weight:700; }
.f-counts { display:flex; gap:22px; }
.fc { text-align:center; }
.fc-val { font-size:clamp(1rem,1.8vw,1.4rem); font-weight:800; line-height:1; }
.fc-lbl { font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase; margin-top:2px; }
.fc.carga .fc-val { color:#ccc; } .fc.carga .fc-lbl { color:#ccc; }
.fc.prep  .fc-val { color:#aaa; } .fc.prep  .fc-lbl { color:#aaa; }
.fc.lacre .fc-val { color:#444; } .fc.lacre .fc-lbl { color:#888; }
.fc.total .fc-val { color:#ddd; } .fc.total .fc-lbl { color:#ddd; }
</style>
</head>
<body>
<div class="bars">
  <div class="bar-row"><div class="bar-label">Carga</div><div class="bar-track"><div class="bar-fill carga" id="b-carga" style="width:0%"></div></div><div class="bar-pct carga" id="p-carga">0%</div></div>
  <div class="bar-row"><div class="bar-label">Preparação</div><div class="bar-track"><div class="bar-fill prep" id="b-prep" style="width:0%"></div></div><div class="bar-pct prep" id="p-prep">0%</div></div>
  <div class="bar-row"><div class="bar-label">Lacradas</div><div class="bar-track"><div class="bar-fill lacre" id="b-lacre" style="width:0%"></div></div><div class="bar-pct lacre" id="p-lacre">0%</div></div>
</div>
<div class="center">
  <div class="data" id="c-data">00/00/0000</div>
  <div class="hora">
    <span class="hora-hm" id="c-h">00</span>
    <span class="hora-sep">:</span>
    <span class="hora-hm" id="c-m">00</span>
    <span class="hora-sep">:</span>
    <span class="hora-s"  id="c-s">00</span>
  </div>
  <div class="status-hero" id="f-status">—</div>
</div>
<div class="footer">
  <div class="f-brand">SIME TV Preparação · 7ª Zona/PI</div>
  <div class="f-counts">
    <div class="fc carga"><div class="fc-val" id="fc-carga">—</div><div class="fc-lbl">Carga</div></div>
    <div class="fc prep"> <div class="fc-val" id="fc-prep">—</div><div class="fc-lbl">Prep.</div></div>
    <div class="fc lacre"><div class="fc-val" id="fc-lacre">—</div><div class="fc-lbl">Lacradas</div></div>
    <div class="fc total"><div class="fc-val" id="fc-total">174</div><div class="fc-lbl">Total</div></div>
  </div>
</div>
<script type="module">
import { bootstrapTvSession } from './sime_tv_auth.js';
import { initSimeDados, getSecoes, getZonaInfo, getEleicaoAtiva } from './sime_dados.js';
import { subscribeCargaLacre } from './sime_realtime.js';

// Preenchido pelo Admin ao provisionar esta TV (mesmos valores públicos do
// projeto Supabase — anon key não é segredo, só a service_role é).
import { SIME_CONFIG } from './sime_config.js';

window.SIME_TOTAL_REAL = null; // preenchido via Supabase quando a sessão da TV existir
// Contagem real de carga/preparação/lacre — antes esta TV só lia
// localStorage['sime_lacre_v3'], que só existe no navegador de quem
// preencheu; numa TV real (outro aparelho) ficava sempre em 0%, sem
// Realtime nenhum (achado crítico da auditoria de UI/UX).
window.SIME_CARGA_LACRE_REAL = null; // { c, p, l }

(async () => {
  const { client } = await bootstrapTvSession(SIME_CONFIG);
  if (!client) return; // sem token de TV configurado ainda — segue no fallback local
  initSimeDados(client);
  const [secoes, zona, eleicao] = await Promise.all([
    getSecoes({ fallback: null }),
    getZonaInfo({ fallback: null }),
    getEleicaoAtiva({ fallback: null }),
  ]);
  if (secoes) window.SIME_TOTAL_REAL = secoes.length;
  if (zona) document.querySelector('.f-brand').textContent = `SIME TV Preparação · ${zona.numero}ª Zona · ${zona.municipio}`;
  if (!eleicao) { if (window.updateBars) window.updateBars(); return; } // sem eleição ativa — segue no fallback local

  async function refetch() {
    const { data } = await client.from('sime_carga_lacre').select('carga,preparacao,lacre').eq('eleicao_id', eleicao.id);
    let c = 0, p = 0, l = 0;
    for (const r of data || []) { if (r.carga) c++; if (r.preparacao) p++; if (r.lacre) l++; }
    window.SIME_CARGA_LACRE_REAL = { c, p, l };
    if (window.updateBars) window.updateBars();
  }
  await refetch();
  // Coordenador de Preparação grava; esta TV só lê — sem interação, então
  // um refetch completo a cada mudança é simples e barato (no máximo uma
  // linha por seção da zona) em vez de reconciliar incrementalmente.
  subscribeCargaLacre(client, () => refetch());
})();
</script>
<script>
function tick() {
  const n=new Date();
  document.getElementById('c-data').textContent=`${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;
  document.getElementById('c-h').textContent=String(n.getHours()).padStart(2,'0');
  document.getElementById('c-m').textContent=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('c-s').textContent=String(n.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick,1000);

// Total real vem do Supabase (window.SIME_TOTAL_REAL, zona-scoped via RLS);
// sem sessão de TV configurada ainda, cai no total local (sime_lacre_v3) e,
// por fim, no fallback histórico da 7ª Zona/PI (174) — offline-first.
function calcTotal(){
  if (window.SIME_TOTAL_REAL) return window.SIME_TOTAL_REAL;
  try{ const d=localStorage.getItem('sime_lacre_v3'); if(d){ const t=Object.keys(JSON.parse(d)).length; return t>0?t:174; }}catch(e){} return 174;
}
function updateBars(){
  const TOTAL=calcTotal();
  document.getElementById('fc-total').textContent=TOTAL;
  let c=0,p=0,l=0;
  if (window.SIME_CARGA_LACRE_REAL) {
    ({ c, p, l } = window.SIME_CARGA_LACRE_REAL);
  } else {
    try{const raw=localStorage.getItem('sime_lacre_v3');if(raw){Object.values(JSON.parse(raw)).forEach(v=>{if(v.carga)c++;if(v.prep)p++;if(v.lacre)l++;});}}catch(e){}
  }
  const pct=v=>Math.round(v/TOTAL*100);
  document.getElementById('b-carga').style.width=pct(c)+'%'; document.getElementById('p-carga').textContent=pct(c)+'%';
  document.getElementById('b-prep').style.width=pct(p)+'%';  document.getElementById('p-prep').textContent=pct(p)+'%';
  document.getElementById('b-lacre').style.width=pct(l)+'%'; document.getElementById('p-lacre').textContent=pct(l)+'%';
  document.getElementById('fc-carga').textContent=c;
  document.getElementById('fc-prep').textContent=p;
  document.getElementById('fc-lacre').textContent=l;
  const f=TOTAL-l;
  const statusEl=document.getElementById('f-status');
  statusEl.textContent=l===0&&c===0?'aguardando início':l===TOTAL?'todas lacradas':l>=TOTAL*0.75?`faltam ${f} urna${f>1?'s':''}`:`${l} de ${TOTAL} lacradas`;
  const tudoLacrado = l===TOTAL && TOTAL>0;
  statusEl.classList.toggle('done', tudoLacrado);
  document.body.classList.toggle('tudo-lacrado', tudoLacrado);
}
updateBars(); setInterval(updateBars,3000);
</script>
</body>
</html>
