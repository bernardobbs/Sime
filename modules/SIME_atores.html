<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIME · Atores</title>
<link rel="stylesheet" href="./sime_theme_cream.css">
<link rel="stylesheet" href="./sime_components.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
.logo{width:32px;height:32px;border-radius:8px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0;}
.h-info{flex:1;}
.h-title{font-weight:800;font-size:.9rem;}
.h-sub{font-size:.68rem;color:var(--text2);}
.tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 12px;}
.tab{padding:10px 14px;font-size:.78rem;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.content{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* BUSCA */
.search-row{display:flex;gap:8px;flex-wrap:wrap;}
.search-row input,.search-row select{padding:9px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--card);font-size:.85rem;color:var(--text);outline:none;}
/* outline:none acima remove o foco nativo — devolvido só no :focus-visible,
   pra não aparecer em clique de mouse mas continuar visível via teclado. */
.search-row input:focus-visible,.search-row select:focus-visible,
.form-group input:focus-visible,.form-group select:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.search-row input{flex:1;min-width:180px;}
.search-row select{min-width:140px;}

/* ATOR CARD */
.ator-card{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:13px 14px;display:flex;align-items:center;gap:12px;}
.ac-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:#fff;flex-shrink:0;}
.ac-info{flex:1;}
.ac-name{font-weight:800;font-size:.9rem;}
.ac-detail{font-size:.72rem;color:var(--text2);margin-top:2px;}
.ac-badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:4px;display:inline-block;color:#fff;}
.ac-btn{padding:10px 14px;border-radius:9px;font-size:.78rem;font-weight:800;cursor:pointer;border:none;background:#25d366;color:#fff;display:flex;align-items:center;gap:5px;flex-shrink:0;text-decoration:none;}

/* FUNCAO COLORS */
.f-mesario              {background:#3a5fa0;}
.f-motorista            {background:#2e7d52;}
.f-tecnico              {background:#8a5c20;}
.f-auxiliar_eleicao     {background:#b8791f;}
.f-coord_acessibilidade {background:#6040a0;}
.f-coord_motoristas     {background:#a0651a;}
.f-coletor_midias       {background:#15803d;}
.f-preposto             {background:#556070;}
.f-cartorio             {background:#2a2a2a;}
.f-coordenador_acessibilidade{background:#6040a0;} /* alias legado */

/* IMPORTAÇÃO */
.import-card{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:18px;}
.ic-title{font-weight:800;margin-bottom:6px;}
.ic-sub{font-size:.78rem;color:var(--text2);margin-bottom:14px;line-height:1.5;}
.drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2);margin-bottom:12px;}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:var(--blue-bg);}
.dz-icon{font-size:2rem;margin-bottom:8px;}
.dz-txt{font-size:.8rem;font-weight:700;color:var(--text2);}
.dz-sub{font-size:.7rem;color:var(--text3);margin-top:4px;}
.csv-preview{background:var(--bg);border-radius:8px;padding:10px;font-size:.72rem;font-family:monospace;color:var(--text2);max-height:120px;overflow-y:auto;border:1px solid var(--border);}
.import-result{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.78rem;font-weight:700;}
.ir-ok  {background:var(--green-bg);color:var(--green);}
.ir-err {background:var(--red-bg);color:var(--red);}
.ir-warn{background:var(--yellow-bg);color:var(--yellow);}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-dark{background:#2a2a2a;color:#fff;}
.btn-dark:hover{background:#444;}
.btn-out{background:var(--bg2);color:var(--text2);border:1px solid var(--border);}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border-radius:13px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.m-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.m-title{font-weight:800;font-size:.92rem;}
.m-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.m-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.form-group label{font-size:.72rem;font-weight:700;color:var(--text2);display:block;margin-bottom:3px;}
.form-group input,.form-group select{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--bg2);font-size:.85rem;color:var(--text);outline:none;}
.close-btn{width:44px;height:44px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.8rem;}

/* TOAST */
/* .toast.show vem de sime_components.css */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:#2a2a2a;color:#fff;padding:9px 16px;border-radius:99px;font-size:.76rem;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;z-index:200;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">S</div>
  <div class="h-info">
    <div class="h-title">SIME · Atores</div>
    <div class="h-sub" id="h-sub">0 atores cadastrados</div>
  </div>
  <button class="btn btn-dark" style="font-size:.72rem;padding:6px 10px;" onclick="abrirModal(null)">+ Novo</button>
</div>

<div class="tabs" role="tablist">
  <div class="tab active" id="tab-lista-btn" role="tab" tabindex="0" aria-selected="true" onclick="goTab('lista',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">📋 Lista</div>
  <div class="tab"        id="tab-guerra-btn" role="tab" tabindex="0" aria-selected="false" onclick="goTab('guerra',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">⚡ Modo Guerra</div>
  <div class="tab"        id="tab-import-btn" role="tab" tabindex="0" aria-selected="false" onclick="goTab('import',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">📥 Importar CSV</div>
  <div class="tab"        id="tab-externos-btn" role="tab" tabindex="0" aria-selected="false" onclick="goTab('externos',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">☎️ Contatos externos</div>
  <div class="tab"        id="tab-disparo-btn" role="tab" tabindex="0" aria-selected="false" onclick="goTab('disparo',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">📢 Disparo em massa</div>
</div>

<div class="content" id="content"></div>

<!-- MODAL NOVO/EDITAR ATOR -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script src="./sime_ui_utils.js"></script>
<script type="module">
// Carrega os atores do Supabase. Este módulo era 100% localStorage: a zona
// tinha centenas de pessoas cadastradas no banco e a tela abria vazia em
// qualquer máquina que não fosse aquela onde o CSV foi importado.
//
// Sem sessão (aberto direto, sem login) nada acontece e o módulo segue no
// localStorage — o cadastro/edição local continua funcionando como antes.
import { createClient } from './vendor/supabase-js.esm.js';
import { initSimeDados, getAtores, getSecoes, getEleicaoAtiva } from './sime_dados.js';
import { SIME_CONFIG } from './sime_config.js';

const supabase = createClient(SIME_CONFIG.supabaseUrl, SIME_CONFIG.supabaseAnonKey);

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;
  initSimeDados(supabase);
  window.supabaseAtores = supabase;

  // Pra log() (Modo Guerra) resolver numero -> secao_id ao gravar em sime_logs.
  const secoesReais = await getSecoes({ fallback: null });
  if (secoesReais) window.SECAO_ID_POR_NUMERO = Object.fromEntries(secoesReais.map(s => [String(s.numero).padStart(4, '0'), s.id]));
  // Pro disparo em massa (modelo "Convocação") personalizar {local}/{municipio} por pessoa.
  if (secoesReais) window.SECAO_INFO_POR_NUMERO = Object.fromEntries(secoesReais.map(s => [String(s.numero).padStart(4, '0'), { local_nome: s.local_nome, municipio: s.municipio }]));

  // Contatos externos (Equatorial e afins). Vivem numa tabela própria e não em
  // sime_atores porque não são pessoas de uma seção: são organizações com
  // abrangência por MUNICÍPIO, e entrariam contando como "ator" nos números da
  // zona e nas campanhas de confirmação de mesário. O cadastro, porém, é aqui
  // — é onde a equipe procura telefone.
  window.recarregarExternos = async () => {
    const { data } = await supabase.from('sime_contatos_externos')
      .select('id,tipo,nome,municipio,telefone,whatsapp,observacao,ativo')
      .eq('ativo', true).order('tipo');
    window.EXTERNOS_REAIS = data || [];
    if (window.render) window.render();
  };
  await window.recarregarExternos();

  const atores = await getAtores({ fallback: null });
  if (!atores) return;
  window.ATORES_REAIS = atores;
  if (window.render) window.render();

  // Pra resolver a eleição ativa da zona na hora de criar um ator novo
  // (salvarAtor(), script normal, sem acesso a import).
  window.getEleicaoAtivaDaZona = (zonaId) => getEleicaoAtiva({ fallback: null, zonaId });
})();
</script>
<script>
const ATORES_KEY = 'sime_atores_v1';
const LOG_KEY    = 'sime_logs_v1';
const FUNCOES    = ['mesario','motorista','tecnico','auxiliar_eleicao','coord_acessibilidade','coord_motoristas','coletor_midias','preposto','junta_eleitoral','cartorio'];
const FUNC_LABEL = {
  mesario:'Mesário', motorista:'Motorista', tecnico:'Técnico',
  auxiliar_eleicao:'Auxiliar de Eleição',
  coord_acessibilidade:'Coord. Acessibilidade',
  coord_motoristas:'Coord. de Motoristas',
  coletor_midias:'Coletor de Mídias',
  preposto:'Preposto',
  cartorio:'Cartório',
  junta_eleitoral:'Junta Eleitoral',
  coordenador_acessibilidade:'Coord. Acessibilidade', // alias legado
};
const FUNC_EMOJI = {
  mesario:'🗳️', motorista:'🚗', tecnico:'🔧',
  auxiliar_eleicao:'🧰',
  coord_acessibilidade:'♿',
  coord_motoristas:'🚌',
  coletor_midias:'📦',
  preposto:'📋',
  cartorio:'🏛️',
  junta_eleitoral:'⚖️',
  coordenador_acessibilidade:'♿', // alias legado
};

// Banco primeiro (a RLS de sime_atores limita à zona do usuário); localStorage
// é o fallback offline. ATORES_REAIS é preenchido pelo <script type="module">
// abaixo assim que a sessão resolve — até lá, ou sem sessão, vale o local.
function loadAtores()  {
  if (window.ATORES_REAIS) return window.ATORES_REAIS;
  try{return JSON.parse(localStorage.getItem(ATORES_KEY)||'[]')}catch(e){return[]}
}
function saveAtores(d) { localStorage.setItem(ATORES_KEY, JSON.stringify(d)); }
// A importação grava o telefone com o 55 do país ('5586...'); o cadastro
// manual costuma gravar sem ('86...'). Normaliza para não duplicar o código
// no link do WhatsApp nem quebrar a formatação.
function telLocal(t)   { const d=String(t||'').replace(/\D/g,''); return d.startsWith('55') ? d.slice(2) : d; }
function fmtTel(t)     { const d=telLocal(t); return d.replace(/^(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3')||t; }
function waLink(t)     { return 'https://wa.me/55'+telLocal(t); }
function serverTs()    { return Date.now(); }
// sime_logs (Supabase) é a fonte real, lida por SIME_relatorios.html — antes
// isto gravava só em sime_logs_v1, um log que nunca saía do navegador de
// quem clicou "CONTATAR" no Modo Guerra, e a auditoria do cartório nunca via
// esses acionamentos. Mantém o espelho local como fallback se a rede falhar.
async function log(acao,secao,payload) {
  const logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
  logs.unshift({acao,modulo:'atores',secao,payload,ts:serverTs()});
  if(logs.length>500) logs.splice(400);
  localStorage.setItem(LOG_KEY,JSON.stringify(logs));

  const sb = window.supabaseAtores;
  if (!sb) return; // sem sessão — fica só o local, como antes
  const secaoId = window.SECAO_ID_POR_NUMERO?.[secao] || null;
  try {
    await sb.from('sime_logs').insert({ acao, modulo: 'atores', secao_id: secaoId, payload });
  } catch (e) { /* já ficou no espelho local acima */ }
}

let curTab='lista';
let searchQ='', filterFuncao='', filterSecao='';
let csvParsed=[];

function goTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  if(btn){ btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }
  render();
}

window.render = render;
function render(){
  const atores=loadAtores();
  document.getElementById('h-sub').textContent=`${atores.length} ator${atores.length!==1?'es':''} cadastrado${atores.length!==1?'s':''}`;

  if(curTab==='externos'){ renderExternos(); return; }
  if(curTab==='import'){ renderImport(); return; }
  if(curTab==='guerra'){ renderGuerra(atores); return; }
  if(curTab==='disparo'){ renderDisparo(atores); return; }
  renderLista(atores);
}

function filterAtores(atores){
  return atores.filter(a=>{
    if(filterFuncao && a.funcao!==filterFuncao) return false;
    if(filterSecao  && a.secao!==filterSecao)   return false;
    if(searchQ){
      const q=searchQ.toLowerCase();
      if(!a.nome.toLowerCase().includes(q) && !a.telefone.includes(q) && !a.secao.includes(q)) return false;
    }
    return a.ativo!==false;
  });
}

function renderLista(atores){
  const filtered=filterAtores(atores);
  const secoes=[...new Set(atores.map(a=>a.secao))].sort();
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="search-row">
      <input type="text" placeholder="Buscar nome, telefone, seção..." value="${searchQ}" oninput="searchQ=this.value;render()">
      <select onchange="filterFuncao=this.value;render()">
        <option value="">Todas funções</option>
        ${FUNCOES.map(f=>`<option value="${f}" ${filterFuncao===f?'selected':''}>${FUNC_EMOJI[f]} ${FUNC_LABEL[f]}</option>`).join('')}
      </select>
    </div>`;
  if(!filtered.length){
    c.innerHTML+='<div style="text-align:center;padding:40px;color:var(--text3);font-size:.85rem">Nenhum ator encontrado.<br><br><button class="btn btn-dark" onclick="abrirModal(null)">+ Cadastrar primeiro ator</button></div>';
    return;
  }
  filtered.forEach(a=>{
    const av=document.createElement('div'); av.className='ator-card';
    av.innerHTML=`
      <div class="ac-av f-${a.funcao}">${a.nome.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
      <div class="ac-info">
        <div class="ac-name">${a.nome}</div>
        <div class="ac-detail">${a.secao?'Seção '+parseInt(a.secao):''} ${a.local||''}</div>
        <div class="ac-detail">${fmtTel(a.telefone)}</div>
        <span class="ac-badge f-${a.funcao}">${FUNC_EMOJI[a.funcao]} ${FUNC_LABEL[a.funcao]}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <a class="ac-btn" href="${waLink(a.telefone)}" target="_blank" title="Abrir WhatsApp">💬 WA</a>
        <button class="btn btn-out" aria-label="Editar" style="font-size:.65rem;padding:5px 8px;min-width:44px;min-height:44px;justify-content:center" onclick="abrirModal('${a.id}')">✏️</button>
      </div>`;
    c.appendChild(av);
  });
}

function renderGuerra(atores){
  const filtered=filterAtores(atores).filter(a=>a.ativo!==false);
  const c=document.getElementById('content');
  c.innerHTML=`
    <div style="background:var(--red-bg);border:1.5px solid var(--red-bd);border-radius:10px;padding:12px 14px;font-size:.78rem;font-weight:700;color:var(--red)">
      ⚡ MODO GUERRA — Contato direto. Use apenas em emergências. Todo acionamento é registrado.
    </div>
    <div class="search-row">
      <input type="text" placeholder="Buscar seção ou nome..." value="${searchQ}" oninput="searchQ=this.value;render()">
      <select onchange="filterFuncao=this.value;render()">
        <option value="">Todas funções</option>
        ${FUNCOES.map(f=>`<option value="${f}" ${filterFuncao===f?'selected':''}>${FUNC_EMOJI[f]} ${FUNC_LABEL[f]}</option>`).join('')}
      </select>
    </div>`;
  if(!filtered.length){
    c.innerHTML+='<div style="text-align:center;padding:32px;color:var(--text3)">Nenhum ator cadastrado para contato.</div>';
    return;
  }
  // Group by secao
  const bySec={};
  filtered.forEach(a=>{ if(!bySec[a.secao]) bySec[a.secao]=[]; bySec[a.secao].push(a); });
  Object.keys(bySec).sort().forEach(sec=>{
    const grp=document.createElement('div');
    grp.innerHTML=`<div style="font-size:.68rem;font-weight:700;color:var(--text3);letter-spacing:.1em;padding:8px 2px 4px">SEÇÃO ${parseInt(sec)||sec}</div>`;
    bySec[sec].forEach(a=>{
      const row=document.createElement('div'); row.className='ator-card';
      row.innerHTML=`
        <div class="ac-av f-${a.funcao}">${FUNC_EMOJI[a.funcao]}</div>
        <div class="ac-info">
          <div class="ac-name">${a.nome}</div>
          <div class="ac-detail">${FUNC_LABEL[a.funcao]} · ${fmtTel(a.telefone)}</div>
        </div>
        <a class="ac-btn" href="${waLink(a.telefone)}" target="_blank" onclick="log('contato_guerra','${sec}',{nome:'${a.nome.replace(/'/g,"\\'")}',funcao:'${a.funcao}'});showToast('📲 Abrindo WhatsApp — ${a.nome.replace(/'/g,"\\'")}...')">
          📲 CONTATAR
        </a>`;
      grp.appendChild(row);
    });
    c.appendChild(grp);
  });
}

function renderImport(){
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="import-card">
      <div class="ic-title">📥 Importar Atores via CSV</div>
      <div class="ic-sub">Faça upload de um arquivo .csv com os campos:<br><code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:.78rem">nome,telefone,secao,funcao</code><br><br>
      Funções válidas: <b>mesario</b> · motorista · tecnico · auxiliar_eleicao · coord_acessibilidade · coord_motoristas · coletor_midias · preposto · cartorio<br>
      Telefone: com DDD, somente números. Ex: 86900000000</div>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()" 
           ondragover="event.preventDefault();this.classList.add('drag')" 
           ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <div class="dz-icon">📄</div>
        <div class="dz-txt">Clique ou arraste o arquivo CSV aqui</div>
        <div class="dz-sub">Apenas arquivos .csv</div>
      </div>
      <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="handleFile(this.files[0])">
      <div id="csv-preview-area"></div>
      <div id="import-result"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-dark" id="btn-import" style="display:none" onclick="importarCSV()">✓ Importar</button>
        <button class="btn btn-out" onclick="csvParsed=[];document.getElementById('csv-preview-area').innerHTML='';document.getElementById('btn-import').style.display='none';document.getElementById('import-result').innerHTML=''">✕ Limpar</button>
        <button class="btn btn-out" onclick="downloadTemplate()">⬇ Baixar modelo</button>
      </div>
    </div>`;
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f) handleFile(f);
}

function handleFile(file){
  if(!file||!file.name.endsWith('.csv')){ showToast('⚠ Selecione um arquivo .csv'); return; }
  const r=new FileReader();
  r.onload=e=>parseCSV(e.target.result);
  r.readAsText(file, 'UTF-8');
}

function parseCSV(text){
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const header=lines[0].toLowerCase().replace(/["\r]/g,'').split(',');
  const iNome=header.indexOf('nome'),iTel=header.indexOf('telefone'),iSec=header.indexOf('secao'),iFunc=header.indexOf('funcao');
  if([iNome,iTel,iSec,iFunc].includes(-1)){ showToast('⚠ Colunas não encontradas: nome,telefone,secao,funcao'); return; }
  
  csvParsed=[];
  const erros=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].replace(/\r/g,'').split(',').map(c=>c.replace(/^"|"$/g,'').trim());
    const nome=cols[iNome]||'', tel=cols[iTel]||''.replace(/\D/g,''),
          sec=cols[iSec]||'', func=(cols[iFunc]||'').toLowerCase();
    if(!nome){ erros.push(`Linha ${i+1}: nome vazio`); continue; }
    const telClean=tel.replace(/\D/g,'');
    if(telClean.length<10||telClean.length>11){ erros.push(`Linha ${i+1}: telefone inválido (${tel})`); continue; }
    if(!FUNCOES.includes(func)){ erros.push(`Linha ${i+1}: função inválida (${func})`); continue; }
    csvParsed.push({nome,telefone:telClean,secao:sec.padStart(4,'0'),funcao:func});
  }

  const pa=document.getElementById('csv-preview-area');
  pa.innerHTML=`<div class="csv-preview">${csvParsed.slice(0,5).map(r=>`${r.nome} | ${fmtTel(r.telefone)} | Seção ${parseInt(r.secao)} | ${FUNC_LABEL[r.funcao]}`).join('\n')}${csvParsed.length>5?`\n... + ${csvParsed.length-5} mais`:''}</div>`;
  
  const ir=document.getElementById('import-result');
  ir.innerHTML=erros.length?`<div class="import-result ir-warn">⚠ ${csvParsed.length} válidos · ${erros.length} erros:<br>${erros.slice(0,3).join('<br>')}${erros.length>3?'<br>...':''}</div>`
                            :`<div class="import-result ir-ok">✓ ${csvParsed.length} registros prontos para importar</div>`;
  if(csvParsed.length) document.getElementById('btn-import').style.display='inline-flex';
}

function importarCSV(){
  if(!csvParsed.length){ showToast('⚠ Nenhum dado para importar'); return; }
  const atores=loadAtores();
  let adicionados=0, duplicatas=0;
  csvParsed.forEach(r=>{
    const dup=atores.find(a=>a.telefone===r.telefone&&a.secao===r.secao&&a.funcao===r.funcao&&a.ativo!==false);
    if(dup){ duplicatas++; return; }
    atores.push({...r, id:'a'+Date.now()+Math.random().toString(36).slice(2,6), ativo:true, created_at:serverTs()});
    adicionados++;
  });
  saveAtores(atores);
  log('importacao_csv','null',{adicionados,duplicatas});
  document.getElementById('import-result').innerHTML=`<div class="import-result ir-ok">✅ ${adicionados} importados · ${duplicatas} duplicatas ignoradas</div>`;
  csvParsed=[];
  document.getElementById('btn-import').style.display='none';
  showToast(`✓ ${adicionados} atores importados`);
  setTimeout(()=>{ goTab('lista'); document.getElementById('tab-lista-btn').click(); },1500);
}

async function salvarExterno(id){
  const sb = window.supabaseAtores;
  if(!sb){ showToast('⚠ Entre com a conta da equipe'); return; }
  const nome = document.getElementById('x-nome').value.trim();
  const tel  = (document.getElementById('x-tel').value||'').replace(/\D/g,'');
  if(!nome){ showToast('⚠ Informe o nome'); return; }
  // 8 dígitos aceita 0800 e telefone fixo antigo — não é celular, mas é
  // exatamente o tipo de número que a concessionária publica.
  if(tel.length < 8){ showToast('⚠ Telefone inválido'); return; }

  const zonaId = await zonaDoUsuario();
  if(!zonaId){ showToast('⚠ Não foi possível resolver sua zona'); return; }

  const payload = {
    zona_id: zonaId,
    tipo: document.getElementById('x-tipo').value,
    nome,
    municipio: document.getElementById('x-mun').value.trim() || null,
    telefone: tel,
    whatsapp: document.getElementById('x-wa').checked,
    observacao: document.getElementById('x-obs').value.trim() || null,
  };

  const { error } = id
    ? await sb.from('sime_contatos_externos').update(payload).eq('id', id)
    : await sb.from('sime_contatos_externos').insert(payload);
  if(error){ showToast('⚠ ' + (error.message||'Falhou ao salvar')); return; }

  closeModal(); showToast('✓ Contato salvo');
  await window.recarregarExternos();
}

function removerExterno(id){
  pedirConfirmacao('Remover este contato?', async () => {
    const sb = window.supabaseAtores;
    const { error } = await sb.from('sime_contatos_externos').update({ ativo:false }).eq('id', id);
    if(error){ showToast('⚠ ' + error.message); return; }
    closeModal(); showToast('✓ Removido');
    await window.recarregarExternos();
  }, { titulo:'Remover contato', labelOk:'🗑 Remover', classeOk:'btn-red' });
}

// A zona vem do usuário logado, nunca de um campo na tela: cadastrar contato
// na zona errada seria oferecer o telefone de outra comarca no dia D.
let _zonaCache = null;
async function zonaDoUsuario(){
  if(_zonaCache) return _zonaCache;
  const sb = window.supabaseAtores;
  const { data:{ user } } = await sb.auth.getUser();
  const { data } = await sb.from('sime_usuarios').select('zona_id').eq('auth_user_id', user?.id).maybeSingle();
  _zonaCache = data?.zona_id || null;
  return _zonaCache;
}

// outros dois modelos, que são literais).

// Modelo "Convocação com confirmação" manda DUAS mensagens, não uma: esta
// primeira só confirma que o número ainda é da pessoa (o Hermes espera a

let dispFuncao = '';
let dispBusca = '';
let dispImagemUrl = '';
let dispSelecionados = null; // Set<id> — null até o primeiro filtro rodar
// null = ainda não editado pelo usuário nesta sessão de modelo — usa o
// template padrão. Trocar função/busca/seleção reconstrói a tela (render())
// mas NÃO deve apagar o que o cartório já escreveu; só trocar de modelo reseta.
let dispMsg = null;
let dispMsgConvocacao = null;

function dispMensagemPadrao(){
  if(dispTipo==='golpe') return TEMPLATE_GOLPE;
  if(dispTipo==='convocacao') return TEMPLATE_VERIFICACAO;
  return '';
}
function dispMensagemConvocacaoPadrao(){
  return dispTipo==='convocacao' ? TEMPLATE_CONVOCACAO_TEXTO : '';
}
function dispMensagemAtual(){ return dispMsg !== null ? dispMsg : dispMensagemPadrao(); }
function dispMensagemConvocacaoAtual(){ return dispMsgConvocacao !== null ? dispMsgConvocacao : dispMensagemConvocacaoPadrao(); }

// Pool elegível pro filtro atual (função + ativo + tem WhatsApp). É sobre
// este conjunto que a seleção por checkbox opera.
function atoresParaDisparo(atores){
  return atores.filter(a => a.ativo && a.telefone && (!dispFuncao || a.funcao===dispFuncao));
}

// Só pra exibição da lista — não afeta quem está selecionado, então buscar
// um nome pra conferir não desmarca ninguém que já estava marcado.
function atoresExibidos(atores){
  const pool = atoresParaDisparo(atores);
  const q = dispBusca.trim().toLowerCase();
  return q ? pool.filter(a => a.nome.toLowerCase().includes(q)) : pool;
}

const DISP_MAX_LISTA = 300;

function rotuloFuncaoDisp(a){
  if(a.funcao==='mesario') return a.funcao_mesa || 'Mesário(a)';

  if(dispSelecionados===null) dispSelecionados = new Set(atoresParaDisparo(atores).map(a=>a.id));

      <div class="form-group"><label>Modelo</label>

        <input type="url" id="dp-imagem" value="${dispImagemUrl}" placeholder="https://... (URL pública de uma imagem, ex.: passo a passo de confirmação no site do TRE)" oninput="dispImagemUrl=this.value">

      <div class="form-group"><label>Filtrar por função</label>
        <select id="dp-funcao" onchange="mudarFuncaoDisparo(this.value)">

function atualizarContagemDisparo(){
  const n = atoresParaDisparo(loadAtores()).filter(a=>dispSelecionados.has(a.id)).length;
  const contagem = document.getElementById('dp-contagem');
  if(contagem) contagem.innerHTML = `<b>${n}</b> pessoa${n!==1?'s':''} selecionada${n!==1?'s':''} vão receber esta mensagem.`;
  const btn = document.getElementById('dp-btn-enviar');
  if(btn){ btn.textContent = `📢 Enviar para ${n} pessoa${n!==1?'s':''}`; btn.disabled = !n; }
}

// Trocar de função reseta a seleção pro novo filtro inteiro (mesmo
// comportamento de antes) — recarrega a tela pra reconstruir a lista, mas
// preserva o que já foi digitado nas mensagens: render() reconstrói os
// textareas com dispMensagemPadrao()/dispMensagemConvocacaoPadrao(), que
// não sabem nada sobre edição manual — sem isso, trocar o filtro apagava
// a mensagem customizada (regressão real, coberta por teste).
function mudarFuncaoDisparo(v){
  const msgAtual = document.getElementById('dp-msg')?.value;
  const msgConvAtual = document.getElementById('dp-msg-convocacao')?.value;
  dispFuncao = v;
  dispSelecionados = null;
  render();
  if(msgAtual !== undefined){ const el = document.getElementById('dp-msg'); if(el) el.value = msgAtual; }
  if(msgConvAtual !== undefined){ const el = document.getElementById('dp-msg-convocacao'); if(el) el.value = msgConvAtual; }
}

// Buscar só muda o que é EXIBIDO na lista, não desmarca ninguém — por isso
// não recarrega a tela inteira, só a lista + contagem.
function buscarDisparo(v){
  dispBusca = v;
  const atores = loadAtores();
  const exibidos = atoresExibidos(atores);
  const lista = document.querySelector('#dp-busca')?.closest('.form-group')?.querySelector('div[style*="overflow-y"]');
  if(lista){
    lista.innerHTML = exibidos.slice(0,DISP_MAX_LISTA).map(a=>`
      <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:.85rem;cursor:pointer;border-radius:5px" onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background=''">
        <input type="checkbox" ${dispSelecionados.has(a.id)?'checked':''} onchange="toggleSelecaoDisparo('${a.id}',this.checked)">
        <span>${a.nome} <span style="opacity:.6">— ${rotuloFuncaoDisp(a)}${a.secao?' · Seção '+a.secao:''}</span></span>
      </label>`).join('') || '<div class="ic-sub" style="padding:8px">Ninguém encontrado com esse filtro/busca.</div>';
  }
}

function toggleSelecaoDisparo(id, marcado){
  if(marcado) dispSelecionados.add(id); else dispSelecionados.delete(id);
  atualizarContagemDisparo();
}

function marcarExibidosDisparo(marcar){
  const exibidos = atoresExibidos(loadAtores());
  for(const a of exibidos){ if(marcar) dispSelecionados.add(a.id); else dispSelecionados.delete(a.id); }
  // Mesmo cuidado de mudarFuncaoDisparo: render() reconstrói os textareas
  // com o texto padrão, então preserva o que já foi editado.
  const msgAtual = document.getElementById('dp-msg')?.value;
  const msgConvAtual = document.getElementById('dp-msg-convocacao')?.value;
  render();
  if(msgAtual !== undefined){ const el = document.getElementById('dp-msg'); if(el) el.value = msgAtual; }
  if(msgConvAtual !== undefined){ const el = document.getElementById('dp-msg-convocacao'); if(el) el.value = msgConvAtual; }
}

// Trocar de modelo troca a mensagem — aí sim justifica recarregar a tela e
// voltar ao template do novo modelo (edição do modelo anterior não se aplica).
function mudarTipoDisparo(v){ dispTipo = v; dispMsg = null; dispMsgConvocacao = null; render(); }

// Troca {nome}/{funcao}/{secao}/{local}/{municipio} pelos dados da pessoa.
// Inofensivo pros outros modelos (golpe/livre) — se o texto não tiver esses
// tokens, não muda nada.
function personalizarMensagem(msg, a){
  const info = window.SECAO_INFO_POR_NUMERO?.[a.secao] || {};
  return msg
    .replaceAll('{nome}', a.nome || '')
    .replaceAll('{funcao}', rotuloFuncaoDisp(a))
    .replaceAll('{secao}', a.secao || '')
    .replaceAll('{local}', info.local_nome || 'local a confirmar')
    .replaceAll('{municipio}', info.municipio || '');
}

function confirmarDisparo(){
  const sb = window.supabaseAtores;
  if(!sb){ showToast('⚠ Entre com a conta da equipe'); return; }
  const msg = (document.getElementById('dp-msg')?.value||'').trim();
  if(!msg){ showToast('⚠ Escreva a mensagem'); return; }
  const ehConvocacao = dispTipo==='convocacao';
  const msgConvocacao = ehConvocacao ? (document.getElementById('dp-msg-convocacao')?.value||'').trim() : '';
  if(ehConvocacao && !msgConvocacao){ showToast('⚠ Escreva a 2ª mensagem (convocação)'); return; }
  const destinatarios = atoresParaDisparo(loadAtores()).filter(a=>dispSelecionados.has(a.id));
  if(!destinatarios.length){ showToast('⚠ Nenhum destinatário selecionado'); return; }
  const aviso = ehConvocacao
    ? `Enfileirar a confirmação de identidade para ${destinatarios.length} pessoa(s)?\n\nA convocação (2ª mensagem + imagem) só sai pra quem responder SIM à primeira. O envio de fato depende do Hermes estar com o disparo ligado.`
    : `Enfileirar esta mensagem para ${destinatarios.length} pessoa(s)?\n\nO envio de fato depende do Hermes estar com o disparo ligado — aqui só populamos a fila.`;

  pedirConfirmacao(aviso, async () => {
    closeModal();
    const zonaId = await zonaDoUsuario();
    if(!zonaId){ showToast('⚠ Não foi possível resolver sua zona'); return; }

    const imagemUrl = (dispImagemUrl||'').trim() || null;
    const linhas = destinatarios.map(a => ({
      ator_id: a.id,
      telefone_whatsapp: a.telefone,
      zona_id: zonaId,
      mensagem_enviada: personalizarMensagem(msg, a),
      mensagem_convocacao: ehConvocacao ? personalizarMensagem(msgConvocacao, a) : null,
      imagem_url: imagemUrl,
      status: 'pendente',
    }));
    const { error } = await sb.from('sime_campanhas_confirmacao').insert(linhas);
    if(error){ showToast('⚠ ' + (error.message||'Falhou ao enfileirar')); return; }

    await log('disparo_massa', '', { quantidade: linhas.length, funcao: dispFuncao || 'todos', modelo: dispTipo, com_imagem: !!imagemUrl, com_confirmacao: ehConvocacao });
    showToast(`✓ ${linhas.length} mensagens enfileiradas — saem pelo Hermes`);
  }, { titulo:'Confirmar disparo', labelOk:'📢 Enfileirar' });
}

// MODAL CRUD
function abrirModal(id){
  const atores=loadAtores();
  const a=id?atores.find(x=>x.id===id):null;
  document.getElementById('modal-body').innerHTML=`
    <div class="m-hdr">
      <div class="m-title">${a?'Editar ator':'Novo ator'}</div>
      <button class="close-btn" aria-label="Fechar" onclick="closeModal()">✕</button>
    </div>
    <div class="m-body">
      <div class="form-group"><label>Nome completo</label><input type="text" id="m-nome" value="${a?.nome||''}"></div>
      <div class="form-group"><label>Telefone / WhatsApp (com DDD)</label><input type="tel" id="m-tel" value="${a?.telefone||''}" placeholder="86900000000"></div>
      <div class="form-group"><label>Número da seção</label><input type="number" id="m-sec" value="${a?parseInt(a.secao):''}" placeholder="63"></div>
      <div class="form-group"><label>Função</label>
        <select id="m-func">
          ${FUNCOES.map(f=>`<option value="${f}" ${a?.funcao===f?'selected':''}>${FUNC_EMOJI[f]} ${FUNC_LABEL[f]}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Observação</label><input type="text" id="m-obs" value="${a?.obs||''}"></div>
    </div>
    <div class="m-foot">
      ${a?`<button class="btn btn-red" onclick="removerAtor('${id}')">🗑 Remover</button>`:''}
      <button class="btn btn-out" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-dark" onclick="salvarAtor('${id||''}')">💾 Salvar</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

async function salvarAtor(id){
  const nome=document.getElementById('m-nome').value.trim();
  const tel=(document.getElementById('m-tel').value||'').replace(/\D/g,'');
  const sec=(document.getElementById('m-sec').value||'').toString().padStart(4,'0');
  const func=document.getElementById('m-func').value;
  const obs=document.getElementById('m-obs').value;
  if(!nome){ showToast('⚠ Nome obrigatório'); return; }
  if(tel.length<10||tel.length>11){ showToast('⚠ Telefone inválido'); return; }

  // Com sessão: grava direto em sime_atores (banco é a fonte real). Sem
  // sessão: mantém o comportamento antigo (só localStorage).
  const sb = window.supabaseAtores;
  if (sb) {
    const secaoId = window.SECAO_ID_POR_NUMERO?.[sec] || null;
    try {
      if (id) {
        const { error } = await sb.from('sime_atores')
          .update({ nome_completo: nome, telefone_whatsapp: tel, secao_id: secaoId, funcao: func, observacao: obs })
          .eq('id', id);
        if (error) throw error;
        // getAtores() fica cacheado pela sessão (sime_dados.js) — buscar de
        // novo devolveria a lista antiga. Aplica a mudança direto na cópia
        // local, que é o que o render() lê.
        const idx=(window.ATORES_REAIS||[]).findIndex(a=>a.id===id);
        if(idx>-1) window.ATORES_REAIS[idx]={...window.ATORES_REAIS[idx],nome,telefone:tel,secao:secaoId?sec:'',funcao:func};
      } else {
        const zonaId = await zonaDoUsuario();
        if (!zonaId) throw new Error('não foi possível resolver sua zona');
        const eleicao = await window.getEleicaoAtivaDaZona(zonaId);
        const { data, error } = await sb.from('sime_atores').insert({
          zona_id: zonaId, eleicao_id: eleicao?.id || null, nome_completo: nome,
          telefone_whatsapp: tel, secao_id: secaoId, funcao: func, observacao: obs, ativo: true,
        }).select('id').single();
        if (error) throw error;
        window.ATORES_REAIS=[...(window.ATORES_REAIS||[]),{id:data.id,nome,telefone:tel,funcao:func,funcao_mesa:'',secao:secaoId?sec:'',confirmacao:'pendente',ativo:true}];
      }
    } catch(e) { showToast('⚠ ' + (e.message||'Falhou ao salvar')); return; }
    closeModal(); showToast('✓ Ator salvo'); render(); return;
  }

  const atores=loadAtores();
  if(id){
    const idx=atores.findIndex(a=>a.id===id);
    if(idx>-1) atores[idx]={...atores[idx],nome,telefone:tel,secao:sec,funcao:func,obs,updated_at:serverTs()};
  } else {
    atores.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,6),nome,telefone:tel,secao:sec,funcao:func,obs,ativo:true,created_at:serverTs()});
  }
  saveAtores(atores); closeModal(); showToast('✓ Ator salvo'); render();
}

function removerAtor(id){
  pedirConfirmacao('Remover este ator?', async () => {
    const sb = window.supabaseAtores;
    if (sb) {
      try {
        const { error } = await sb.from('sime_atores').update({ ativo: false }).eq('id', id);
        if (error) throw error;
        const idx=(window.ATORES_REAIS||[]).findIndex(a=>a.id===id);
        if(idx>-1) window.ATORES_REAIS[idx]={...window.ATORES_REAIS[idx],ativo:false};
      } catch(e) { showToast('⚠ ' + (e.message||'Falhou ao remover')); return; }
      closeModal(); showToast('✓ Removido'); render(); return;
    }

    const atores=loadAtores().map(a=>a.id===id?{...a,ativo:false}:a);
    saveAtores(atores); closeModal(); showToast('✓ Removido'); render();
  }, { titulo:'Remover ator', labelOk:'🗑 Remover', classeOk:'btn-red' });
}

function closeModal(e){
  if(!e||e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

// Modal customizado pra confirmações destrutivas/de envio — antes 3 ações
// usavam confirm() nativo, quebrando o padrão visual do resto do sistema
// (achado "alto" da auditoria). Reaproveita o mesmo overlay/modal-body já
// usado pelos formulários de edição.
function pedirConfirmacao(mensagem, aoConfirmar, opts={}){
  document.getElementById('modal-body').innerHTML = `
    <div class="m-hdr">
      <div class="m-title">${opts.titulo||'Confirmar'}</div>
      <button class="close-btn" aria-label="Fechar" onclick="closeModal()">✕</button>
    </div>
    <div class="m-body"><div style="font-size:.85rem;color:var(--text2);white-space:pre-line;line-height:1.5">${mensagem}</div></div>
    <div class="m-foot">
      <button class="btn btn-out" onclick="closeModal()">Cancelar</button>
      <button class="btn ${opts.classeOk||'btn-dark'}" id="confirmacao-ok-btn">${opts.labelOk||'Confirmar'}</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('confirmacao-ok-btn').onclick = aoConfirmar;
}
window.pedirConfirmacao = pedirConfirmacao;

// showToast() vem de sime_ui_utils.js

render();
</script>
</body>
</html>
