<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SIME · Acessibilidade</title>
<link rel="stylesheet" href="./sime_theme_dark.css">
<link rel="stylesheet" href="./sime_components.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--body-bg);display:flex;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;overscroll-behavior:none;}

.remote{
  width:100%;max-width:390px;
  background:linear-gradient(160deg,#232330 0%,#1c1c26 50%,#181820 100%);
  border-left:1px solid #2a2a3a;border-right:1px solid #2a2a3a;
  display:flex;flex-direction:column;padding:16px 16px 40px;gap:12px;
  position:relative;min-height:100vh;
}

/* ── DISPLAY / CABEÇALHO ── */
.display{background:var(--display-bg);border-radius:14px;padding:12px 14px;border:1px solid #22223a;box-shadow:inset 0 3px 10px rgba(0,0,0,.6);}
.d-brand{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;}
.d-sync{font-size:.6rem;letter-spacing:normal;text-transform:none;}
.d-local{font-size:1.15rem;font-weight:900;color:var(--text);line-height:1.15;}
.d-sub{font-size:.72rem;color:var(--text2);margin-top:3px;}
.d-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.dc{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.dc.ok  {background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.dc.warn{background:rgba(245,158,11,.14);color:var(--yellow);border:1px solid rgba(245,158,11,.25);}
.dc.err {background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.dc.off {background:rgba(255,255,255,.04);color:var(--text3);border:1px solid rgba(255,255,255,.07);}

/* ── SEPARADOR ── */
.sec-label{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);text-align:center;display:flex;align-items:center;gap:8px;margin-top:2px;}
.sec-label::before,.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,#2a2a40,transparent);}

/* ── CARD DE SEÇÃO ── */
.acard{
  background:linear-gradient(160deg,#22222f,#1a1a24);
  border:1px solid #2a2a3a;border-top:1px solid rgba(255,255,255,.05);
  border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
.acard.alert{border-color:rgba(239,68,68,.4);box-shadow:0 0 0 1px rgba(239,68,68,.2),0 4px 12px rgba(0,0,0,.4);}
.acard-top{display:flex;align-items:center;gap:10px;}
.acard-num{font-size:1.35rem;font-weight:900;color:var(--text);line-height:1;}
.acard-info{flex:1;min-width:0;}
.acard-local{font-size:.68rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard-badge{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:99px;flex-shrink:0;}
.ab-ok{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.ab-fila{background:rgba(245,158,11,.14);color:var(--yellow);border:1px solid rgba(245,158,11,.25);}
.ab-alert{background:rgba(239,68,68,.16);color:var(--red);border:1px solid rgba(239,68,68,.3);}

/* ── FILA ── */
.fila-inline{
  background:linear-gradient(160deg,#2a1e06,#3d2c0a);
  border-radius:14px;border-top:1px solid rgba(245,158,11,.18);
  box-shadow:0 4px 0 var(--yellow-s),0 6px 12px var(--btn-shadow);
  padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;
}
.fila-lbl{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:#a07830;text-transform:uppercase;}
.fila-num{font-size:2.3rem;font-weight:900;color:#fbbf24;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.4);min-width:44px;text-align:center;}
.fila-num.zero{color:#9090a8;font-size:1.8rem;}
.fila-row{display:flex;align-items:center;gap:7px;width:100%;}
.fbtn{
  flex:1;height:50px;border-radius:11px;border:none;cursor:pointer;
  font-size:1.35rem;font-weight:900;transition:all .08s;
  display:flex;align-items:center;justify-content:center;
}
.fbtn:active{transform:scale(.93);}
.fbtn.minus{background:#1a1020;color:#f97316;}
.fbtn.plus {background:#0a2010;color:#34d399;}
.fbtn.big  {font-size:1rem;font-weight:800;}
.fbtn.zero-btn{flex:none;width:50px;background:#1a1a2e;color:#6060a8;font-size:.72rem;font-weight:700;}

/* ── BOTÕES DE PÂNICO ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.pbtn{
  position:relative;border:none;border-radius:13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:14px 8px 12px;transition:transform .07s,box-shadow .07s;
  -webkit-user-select:none;user-select:none;border-top:1px solid rgba(255,255,255,.07);
}
.pbtn:active,.pbtn.pressing{transform:translateY(3px)!important;}
.picon{font-size:1.4rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.plabel{font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.65);text-align:center;line-height:1.2;}
.psub{font-size:.54rem;color:rgba(255,255,255,.32);text-align:center;margin-top:-2px;}

/* estado normal (vermelho apagado — pronto para acionar) */
.pbtn.idle{background:linear-gradient(160deg,#3a1212,#260c0c);box-shadow:0 4px 0 var(--red-s),0 6px 12px var(--btn-shadow);border-top-color:rgba(239,68,68,.15);}
/* estado ativo (pulsando) */
.pbtn.active{background:linear-gradient(160deg,#5a1414,#3a0e0e);box-shadow:0 4px 0 var(--red-s),0 6px 12px var(--btn-shadow);animation:pulse-panic 1s infinite;}
.pbtn.active .plabel,.pbtn.active .picon{color:#fff;}
/* estado resolvido */
.pbtn.resolved{background:linear-gradient(160deg,#0d2218,#081610);box-shadow:0 4px 0 var(--green-s),0 6px 12px var(--btn-shadow);border-top-color:rgba(34,197,94,.15);}
.pbtn.resolved .plabel{color:var(--green);}
@keyframes pulse-panic{0%,100%{box-shadow:0 4px 0 var(--red-s),0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 4px 0 var(--red-s),0 0 0 7px rgba(239,68,68,0.28);}}
.pbadge{position:absolute;top:6px;right:8px;font-size:.6rem;font-weight:800;}

/* ── TOAST ── */
/* .toast.show vem de sime_components.css */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:#1e1e2e;color:var(--text);padding:10px 18px;border-radius:99px;font-size:.78rem;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;z-index:200;white-space:nowrap;border:1px solid #2a2a40;box-shadow:0 4px 16px rgba(0,0,0,.5);max-width:90vw;}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-icon{font-size:2.4rem;margin-bottom:10px;}
.empty-txt{font-size:.85rem;line-height:1.5;}

/* ── LOGIN (PIN) ── */
.login-view{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;gap:14px;text-align:center;}
.login-view.active{display:flex;}
.login-logo{width:56px;height:56px;border-radius:14px;background:#6040a0;display:flex;align-items:center;justify-content:center;font-size:1.7rem;}
.login-title{font-size:1.05rem;font-weight:800;color:var(--text);}
.login-sub{font-size:.8rem;color:var(--text2);line-height:1.5;max-width:280px;}
.pin-input-wrap{display:flex;gap:8px;justify-content:center;margin-top:6px;}
.pin-inp{width:48px;height:56px;border-radius:11px;border:2px solid #2a2a3a;background:#1a1a24;text-align:center;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);outline:none;transition:border-color .15s;-moz-appearance:textfield;}
.pin-inp::-webkit-outer-spin-button,.pin-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.pin-inp:focus{border-color:var(--blue);}
.pin-inp.error{border-color:var(--red);background:#2a0e0e;}
.btn-login{margin-top:6px;padding:13px 34px;border-radius:12px;border:none;background:#6040a0;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;}
.btn-login:active{transform:translateY(2px);}
.login-hint{font-size:.7rem;color:var(--text3);}

.view{display:none;flex-direction:column;gap:12px;}
.view.active{display:flex;}
</style>
</head>
<body>
<div class="remote">

  <!-- ── LOGIN (QR + PIN) ── -->
  <div class="login-view" id="view-login">
    <div class="login-logo">♿</div>
    <div class="login-title">SIME · Acessibilidade</div>
    <div class="login-sub">Digite o PIN de 4 dígitos recebido do cartório ou escaneie o QR Code com a câmera do celular.</div>
    <div class="pin-input-wrap">
      <input class="pin-inp" id="pin-0" type="number" inputmode="numeric" min="0" max="9" oninput="pinInput(this,0)">
      <input class="pin-inp" id="pin-1" type="number" inputmode="numeric" min="0" max="9" oninput="pinInput(this,1)">
      <input class="pin-inp" id="pin-2" type="number" inputmode="numeric" min="0" max="9" oninput="pinInput(this,2)">
      <input class="pin-inp" id="pin-3" type="number" inputmode="numeric" min="0" max="9" oninput="pinInput(this,3)">
    </div>
    <button class="btn-login" onclick="loginWithPIN()">Entrar →</button>
    <div class="login-hint">Não tem PIN? Peça ao coordenador do cartório.</div>
  </div>

  <!-- ── APP ── -->
  <div class="view" id="view-app">
    <div class="display">
      <div class="d-brand">
        <span>SIME · Coord. Acessibilidade</span>
        <span class="d-sync" id="sync-badge" title="Salvo localmente">🟢</span>
      </div>
      <div class="d-local" id="d-local">—</div>
      <div class="d-sub" id="d-sub">—</div>
      <div class="d-row" id="d-chips"></div>
    </div>

    <div class="sec-label">Seções acessíveis do local</div>

    <div id="list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="./sime_ui_utils.js"></script>
<script type="module">
import { bootstrapCampoSession } from './sime_campo_auth.js';
import { initSimeDados, getSecoes, getEleicaoAtiva } from './sime_dados.js';
import { enqueue, iniciarRetryPeriodico } from './sime_offline_queue.js';

// Preenchido pelo Admin no deploy (mesmos valores públicos do projeto Supabase
// — a anon key não é segredo, só a service_role é).
const SIME_CONFIG = { supabaseUrl: 'https://unjhnlcmxbrlonppchux.supabase.co', supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamhubGNteGJybG9ucHBjaHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDM1MTEsImV4cCI6MjA5ODkxOTUxMX0.3o3UhHXrLkHYz4ffBev0zb62VwcnPNP-ggbuiJG4vBs' };

let campoClient = null;
let eleicaoId = null;
const secaoIdPorNumero = {}; // numero (63) -> UUID de sime_secoes

async function resolverEscopo() {
  initSimeDados(campoClient);
  const eleicao = await getEleicaoAtiva({ fallback: null });
  if (eleicao) eleicaoId = eleicao.id;
  const secoes = await getSecoes({ fallback: null });
  if (secoes) for (const s of secoes) secaoIdPorNumero[s.numero] = s.id;
}

async function syncQueueFn(acao, dados) {
  if (!campoClient) throw new Error('sem sessão de campo');
  const { error } = await campoClient.rpc('sime_acao_acessibilidade', dados);
  if (error) throw error;
}

// Exposto pro <script> clássico (adjFila/togglePanico). secaoNumero é a
// string tipo '0063'. Login local (PIN) já validou e a UI já está de pé —
// isto só tenta uma sessão real do Supabase em paralelo, sem bloquear nada.
window.simeCampo = {
  syncAcessibilidade(secaoNumero, partial) {
    if (!campoClient || !eleicaoId) return;
    const secaoId = secaoIdPorNumero[parseInt(secaoNumero, 10)];
    if (!secaoId) return;
    const dados = { p_secao_id: secaoId, p_eleicao_id: eleicaoId, ...partial };
    syncQueueFn('acessibilidade', dados).catch(() => enqueue('acessibilidade', dados));
  },
};

window.tentarLoginCampo = async function(token, pin) {
  const { client } = await bootstrapCampoSession({
    supabaseUrl: SIME_CONFIG.supabaseUrl, supabaseAnonKey: SIME_CONFIG.supabaseAnonKey, token, pin,
  });
  if (!client) return false;
  campoClient = client;
  await resolverEscopo();
  iniciarRetryPeriodico(syncQueueFn);
  return true;
};
</script>
<script>
// ══════════════════════════════════════════════════════════════
// DADOS DE SEÇÕES (fase homologação — em produção vem do local_id
// do token de acesso). Cada seção pertence a um "local" de votação.
// ══════════════════════════════════════════════════════════════
const SECOES = [
  {n:'0063',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0064',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0065',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0066',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0124',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0145',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0181',local:'G.E. Treze de Março',       mun:'Campo Maior'},
  {n:'0017',local:'Col. Est. Profª Raimundinho Andrade',mun:'Campo Maior'},
  {n:'0018',local:'Col. Est. Profª Raimundinho Andrade',mun:'Campo Maior'},
  {n:'0019',local:'Col. Est. Profª Raimundinho Andrade',mun:'Campo Maior'},
  {n:'0033',local:'G.E. Valdivino Tito',       mun:'Campo Maior'},
  {n:'0034',local:'G.E. Valdivino Tito',       mun:'Campo Maior'},
  {n:'0035',local:'G.E. Valdivino Tito',       mun:'Campo Maior'},
  {n:'0242',local:'Esc. Mun. N.S. de Fátima',  mun:'Campo Maior'},
  {n:'0248',local:'Esc. Mun. N.S. de Fátima',  mun:'Campo Maior'},
];

// ══════════════════════════════════════════════════════════════
// ESTADO + PERSISTÊNCIA
// Chave própria (sime_acess_v1) para não colidir com as gravações
// full-object do Mesário em sime_mesa_v1. Mantém os MESMOS nomes de
// campo (panico / panico_resolved / fila) para leitura futura pelo
// Admin e pelas TVs (item pendente #2).
// ══════════════════════════════════════════════════════════════
const STORE_KEY  = 'sime_acess_v1';
const TOKENS_KEY = 'sime_tokens_v1';

// { "0063": { local, fila, panico:{energia,urna}, panico_resolved:{energia,urna}, ts } }
let state = {};
let localFiltro = null;   // nome do local; null = todos (modo dev/admin)
let coordNome   = null;

function loadState(){
  try{ state = JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ state = {}; }
}
function saveSecao(n){
  try{
    const all = JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    all[n] = state[n];
    localStorage.setItem(STORE_KEY, JSON.stringify(all));
    syncOK(true);
  }catch(e){ syncOK(false); }
}
function ensureSecao(n){
  if(!state[n]){
    const meta = SECOES.find(s=>s.n===n);
    state[n] = {
      local: meta?.local || '',
      fila: 0,
      panico: { energia:false, urna:false },
      panico_resolved: { energia:false, urna:false },
      // TODO: na migração substituir Date.now() por supabase.rpc('sime_now')
      ts: Date.now(),
    };
  }
  return state[n];
}

// ══════════════════════════════════════════════════════════════
// SEÇÕES VISÍVEIS (filtradas pelo local do coordenador)
// ══════════════════════════════════════════════════════════════
function secoesVisiveis(){
  if(!localFiltro) return SECOES;
  const alvo = localFiltro.toLowerCase();
  return SECOES.filter(s => s.local.toLowerCase() === alvo);
}

// ══════════════════════════════════════════════════════════════
// AÇÕES
// ══════════════════════════════════════════════════════════════
function adjFila(n, delta){
  const s = ensureSecao(n);
  if(delta === -999) s.fila = 0;
  else s.fila = Math.max(0, s.fila + delta);
  s.ts = Date.now();
  vib(20);
  saveSecao(n);
  if (window.simeCampo) window.simeCampo.syncAcessibilidade(n, { p_fila: s.fila });
  renderCard(n);
}

// Pânico é reversível → toque único, sem modal (filosofia: modal só p/ irreversível)
function togglePanico(n, tipo){  // tipo: 'energia' | 'urna'
  const s = ensureSecao(n);
  const ativo    = s.panico[tipo];
  const rotulos  = { energia:'⚡ Falta de energia', urna:'🗳️ Problema na urna' };
  if(!ativo){
    s.panico[tipo] = true;
    s.panico_resolved[tipo] = false;
    showToast(`${rotulos[tipo]} — Seção ${parseInt(n)} ACIONADO`);
    vib([100,50,100,50,100]);
  } else {
    s.panico[tipo] = false;
    s.panico_resolved[tipo] = true;
    showToast(`${rotulos[tipo]} — Seção ${parseInt(n)} resolvido ✓`);
    vib([60,30,60]);
  }
  s.ts = Date.now();
  saveSecao(n);
  if (window.simeCampo) {
    const campo = tipo === 'energia' ? 'p_panico_energia' : 'p_panico_urna';
    const campoResolvido = tipo === 'energia' ? 'p_panico_energia_resolvido' : 'p_panico_urna_resolvido';
    window.simeCampo.syncAcessibilidade(n, { [campo]: s.panico[tipo], [campoResolvido]: s.panico_resolved[tipo] });
  }
  renderCard(n);
  renderChips();
}

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function panicoAtivoSecao(n){
  const s = state[n]; if(!s) return false;
  return (s.panico.energia && !s.panico_resolved.energia) ||
         (s.panico.urna    && !s.panico_resolved.urna);
}

function cardBadge(n){
  const s = state[n];
  if(panicoAtivoSecao(n)) return `<span class="acard-badge ab-alert">🔴 Emergência</span>`;
  if(s && s.fila > 0)     return `<span class="acard-badge ab-fila">👥 ${s.fila} na fila</span>`;
  return `<span class="acard-badge ab-ok">OK</span>`;
}

function pbtnHTML(n, tipo, icon, label){
  const s = state[n] || {panico:{},panico_resolved:{}};
  const ativo = s.panico?.[tipo];
  const resolv = !ativo && s.panico_resolved?.[tipo];
  const cls = ativo ? 'active' : resolv ? 'resolved' : 'idle';
  const badge = ativo ? '🔴' : resolv ? '✓' : '';
  const sub = ativo ? 'ativo — toque p/ resolver'
            : resolv ? 'resolvido' : 'toque para acionar';
  return `<button class="pbtn ${cls}" onclick="togglePanico('${n}','${tipo}')">
    <span class="picon">${icon}</span>
    <span class="plabel">${label}</span>
    <span class="psub">${sub}</span>
    <span class="pbadge">${badge}</span>
  </button>`;
}

function cardHTML(sec){
  const n = sec.n;
  const s = state[n] || {fila:0};
  const fila = s.fila || 0;
  return `
    <div class="acard${panicoAtivoSecao(n)?' alert':''}" data-sec="${n}">
      <div class="acard-top">
        <div class="acard-num">${parseInt(n)}</div>
        <div class="acard-info">
          <div class="acard-local">${sec.local}</div>
        </div>
        ${cardBadge(n)}
      </div>

      <div class="fila-inline">
        <div class="fila-lbl">👥 Fila de eleitores</div>
        <div class="fila-num ${fila===0?'zero':''}" id="fn-${n}">${fila}</div>
        <div class="fila-row">
          <button class="fbtn minus big" onclick="adjFila('${n}',-5)">−5</button>
          <button class="fbtn minus"     onclick="adjFila('${n}',-1)">−</button>
          <button class="fbtn zero-btn"  onclick="adjFila('${n}',-999)">0</button>
          <button class="fbtn plus"      onclick="adjFila('${n}',1)">+</button>
          <button class="fbtn plus big"  onclick="adjFila('${n}',5)">+5</button>
        </div>
      </div>

      <div class="g2">
        ${pbtnHTML(n,'energia','⚡','Energia')}
        ${pbtnHTML(n,'urna','🗳️','Urna')}
      </div>
    </div>`;
}

// Re-render de um único card (após ação)
function renderCard(n){
  const old = document.querySelector(`.acard[data-sec="${n}"]`);
  if(!old) return;
  const sec = SECOES.find(s=>s.n===n);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(sec).trim();
  old.replaceWith(tmp.firstChild);
  bindPress();
}

function renderList(){
  const list = document.getElementById('list');
  const secoes = secoesVisiveis();
  if(!secoes.length){
    list.innerHTML = `<div class="empty"><div class="empty-icon">♿</div><div class="empty-txt">Nenhuma seção atribuída a este local.<br>Contate o cartório.</div></div>`;
    return;
  }
  list.innerHTML = secoes.map(cardHTML).join('');
  bindPress();
}

function renderChips(){
  const secoes = secoesVisiveis();
  let alerta=0, fila=0, ok=0;
  secoes.forEach(sec=>{
    const s = state[sec.n];
    if(panicoAtivoSecao(sec.n)) alerta++;
    else if(s && s.fila>0) fila++;
    else ok++;
  });
  const chips = [];
  chips.push(`<span class="dc ${alerta?'err':'off'}">${alerta} emergência${alerta!==1?'s':''}</span>`);
  chips.push(`<span class="dc ${fila?'warn':'off'}">${fila} com fila</span>`);
  chips.push(`<span class="dc ${ok&&!alerta?'ok':'off'}">${ok} ok</span>`);
  document.getElementById('d-chips').innerHTML = chips.join('');
}

function renderHeader(){
  const secoes = secoesVisiveis();
  const locNome = localFiltro || 'Todos os locais';
  const mun = secoes[0]?.mun || '';
  document.getElementById('d-local').textContent = locNome;
  document.getElementById('d-sub').textContent =
    `${coordNome ? coordNome + ' · ' : ''}${secoes.length} seç${secoes.length!==1?'ões':'ão'}${mun?' · '+mun:''}`;
}

function renderAll(){ renderHeader(); renderChips(); renderList(); }

// ══════════════════════════════════════════════════════════════
// PRESS VISUAL
// ══════════════════════════════════════════════════════════════
function bindPress(){
  document.querySelectorAll('.pbtn').forEach(b=>{
    b.addEventListener('touchstart', ()=>b.classList.add('pressing'), {passive:true});
    b.addEventListener('touchend',   ()=>setTimeout(()=>b.classList.remove('pressing'),120), {passive:true});
  });
}

// ══════════════════════════════════════════════════════════════
// AUTENTICAÇÃO — TOKEN (QR) + PIN
// Um token de acessibilidade carrega o local (campo `local` ou
// `locais[]`); na ausência de tokens, entra em modo dev (todos).
// ══════════════════════════════════════════════════════════════
function loadAllTokens(){ try{ return JSON.parse(localStorage.getItem(TOKENS_KEY)||'{}'); }catch(e){ return {}; } }
function findTokenById(id){ return loadAllTokens()[id] || null; }
function findTokenByPIN(pin){ return Object.values(loadAllTokens()).find(t=>t.pin===pin) || null; }
function validateToken(t){
  if(!t) return false;
  if(t.expira_em && Date.now() > t.expira_em) return false;
  return true;
}

function tokenLocal(t){
  // aceita `local` (string) ou `locais` (array) — 1º local
  if(t.local) return t.local;
  if(Array.isArray(t.locais) && t.locais.length) return t.locais[0];
  return null;
}

function applyToken(t){
  // marca uso na primeira vez
  if(!t.usado_em){
    const tokens = loadAllTokens();
    if(tokens[t.id]){ tokens[t.id].usado_em = Date.now(); localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens)); }
  }
  coordNome   = t.nome || null;
  localFiltro = tokenLocal(t);
  enterApp();
  // Login local (PIN) já validou e a UI já está de pé — tenta a sessão real
  // do Supabase em paralelo, sem bloquear (offline-first: continua 100%
  // funcional se falhar, só não sincroniza com o cartório).
  if (window.tentarLoginCampo && t.pin) window.tentarLoginCampo(t.id, t.pin);
}

function enterApp(){
  showView('view-app');
  renderAll();
}

function showView(id){
  document.querySelectorAll('.view, .login-view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── PIN ──
function pinInput(el, idx){
  if(el.value.length > 1) el.value = el.value.slice(-1);
  if(el.value && idx < 3) document.getElementById('pin-'+(idx+1)).focus();
  if(idx === 3 && el.value) loginWithPIN();
}
function loginWithPIN(){
  const pin = [0,1,2,3].map(i=>document.getElementById('pin-'+i).value).join('');
  if(pin.length < 4){ showToast('⚠ Digite os 4 dígitos do PIN'); document.getElementById('pin-0').focus(); return; }
  const t = findTokenByPIN(pin);
  if(!t){
    [0,1,2,3].forEach(i=>{ const el=document.getElementById('pin-'+i); el.classList.add('error'); setTimeout(()=>el.classList.remove('error'),800); });
    showToast('⚠ PIN inválido — verifique e tente novamente');
    return;
  }
  if(!validateToken(t)){ showToast('⚠ Este token expirou. Contate o cartório.'); return; }
  applyToken(t);
}

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
// vib()/showToast() vêm de sime_ui_utils.js
function syncOK(ok){
  const b = document.getElementById('sync-badge');
  if(!b) return;
  b.textContent = ok ? '🟢' : '🟡';
  b.title = ok ? 'Salvo localmente' : 'Sincronização pendente';
}

// ══════════════════════════════════════════════════════════════
// INIT — detecta token/local na URL ou cai no PIN / modo dev
// ══════════════════════════════════════════════════════════════
(function init(){
  loadState();

  const params  = new URLSearchParams(window.location.search);
  const tokenId = params.get('token');
  const pinP    = params.get('pin');
  const localP  = params.get('local');   // ?local=G.E. Treze de Março

  // 1. Local direto na URL (acesso simples / impressão)
  if(localP){ localFiltro = decodeURIComponent(localP); enterApp(); return; }

  // 2. Token na URL
  if(tokenId){
    const t = findTokenById(tokenId);
    if(t && validateToken(t)){ applyToken(t); return; }
    showToast('Token inválido ou expirado — use o PIN');
  }
  if(pinP){
    const t = findTokenByPIN(pinP);
    if(t && validateToken(t)){ applyToken(t); return; }
  }

  // 3. Sem tokens cadastrados → modo dev (mostra todos os locais)
  if(Object.keys(loadAllTokens()).length === 0){
    localFiltro = null;
    enterApp();
    return;
  }

  // 4. Tela de PIN
  showView('view-login');
  setTimeout(()=>document.getElementById('pin-0')?.focus(), 300);
})();
</script>
