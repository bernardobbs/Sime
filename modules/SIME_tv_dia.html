<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIME TV Dia</title>
<link rel="stylesheet" href="./sime_theme_purple.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;}
body{display:flex;flex-direction:column;}
.topbar{height:40px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;}
.t-logo{font-size:.72rem;font-weight:900;letter-spacing:.1em;color:var(--blue);}
.t-sep{width:1px;height:16px;background:var(--border);}
.t-title{font-size:.76rem;font-weight:700;color:var(--text2);}
.t-stats{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
.ts{font-size:.63rem;font-weight:700;display:flex;align-items:center;gap:3px;}
.tsd{width:5px;height:5px;border-radius:50%;}
.t-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.t-clock{font-size:.8rem;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums;}
.fase-bar{height:34px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;}
.fase-btn{padding:4px 12px;border-radius:99px;font-size:.7rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .2s;}
.fase-btn.active.ab{background:#2d50a0;color:#fff;border-color:#2d50a0;}
.fase-btn.active.enc{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
.fase-btn.active.prob{background:#dc2626;color:#fff;border-color:#dc2626;}
.fase-info{font-size:.6rem;color:var(--text3);}
.switch-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.62rem;color:var(--text2);}
.switch-wrap input{font-size:.65rem;padding:2px 6px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);}
.auto-label{font-size:.6rem;padding:2px 8px;border-radius:99px;font-weight:700;}
.auto-on{background:var(--arc-done);color:#fff;}
.auto-off{background:var(--bg2);color:var(--text3);border:1px solid var(--border);}
.content{flex:1;overflow:hidden;position:relative;min-height:0;}
.v-page{position:absolute;inset:0;padding:5px 8px 2px;opacity:0;transition:opacity .4s;pointer-events:none;display:flex;flex-direction:column;gap:4px;}
.v-page.active{opacity:1;pointer-events:all;}
.city-hdr{display:flex;align-items:center;gap:8px;padding:2px 2px 4px;flex-shrink:0;}
.city-stripe{width:3px;border-radius:2px;height:22px;flex-shrink:0;}
.city-nome{font-size:.92rem;font-weight:800;}
.city-meta{font-size:.67rem;color:var(--text2);}
.city-prog{margin-left:auto;font-size:.7rem;font-weight:700;}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:4px;flex:1;overflow:hidden;align-content:start;}
.loc{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:6px 7px 8px;display:flex;flex-direction:column;gap:3px;transition:background .5s,border-color .5s;}
.loc.done-cartorio{background:#f0fdf6;border-color:#6ee7b0;}
.loc.done-motorista{background:#eff6ff;border-color:#93c5fd;}
.loc.done-enc{background:#f0f7ff;border-color:#bfdbfe;}
.loc.has-prob{background:#fef2f2;border-color:#fca5a5;}
.loc.has-delay{background:#fffbf0;border-color:#fcd34d;}
.loc.all-gone{display:none;}
.loc-name{font-size:.63rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loc.done-cartorio .loc-name{color:#15803d;}
.loc.done-motorista .loc-name{color:#1d4ed8;}
.loc.done-enc .loc-name{color:#2563eb;}
.loc-status{min-height:13px;font-size:.58rem;font-weight:700;}

/* Barra de progresso dupla (fase encerramento) */
.urna-bar-wrap{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.urna-bar-row{display:flex;align-items:center;gap:4px;font-size:.56rem;font-weight:700;}
.urna-bar-lbl{width:60px;flex-shrink:0;color:var(--text2);}
.urna-bar-track{flex:1;height:5px;background:var(--arc-off);border-radius:99px;overflow:hidden;}
.urna-bar-fill{height:100%;border-radius:99px;transition:width .4s;}
.urna-bar-count{min-width:28px;text-align:right;color:var(--text2);}

.ls-ok{color:#16a34a;}.ls-late{color:#dc2626;}.ls-warn{color:#d97706;}.ls-enc{color:#2563eb;}
.loc-circles{display:flex;flex-wrap:wrap;gap:4px 3px;padding-bottom:2px;}
.sw{position:relative;width:52px;height:52px;flex-shrink:0;margin-bottom:10px;transition:opacity .5s;cursor:pointer;}
.sw:hover svg circle{filter:brightness(1.15);}
.sw.gone{opacity:0;pointer-events:none;width:0;height:0;padding:0;margin:0;overflow:hidden;}
.sw.has-issue{cursor:pointer;}

/* Tooltip customizado (aparece ao hover) */
.sw-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1e1b2e;color:#e0e0f0;
  font-size:.62rem;font-weight:600;line-height:1.4;
  padding:5px 9px;border-radius:7px;
  white-space:nowrap;z-index:30;
  pointer-events:none;
  opacity:0;transition:opacity .15s;
  border:1px solid #2a2840;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.sw-tip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#1e1b2e;
}
.sw:hover .sw-tip{opacity:1;}

/* Modal de detalhe da seção */
.sec-overlay{position:fixed;inset:0;background:rgba(30,27,46,.6);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.sec-overlay.open{opacity:1;pointer-events:all;}
.sec-modal{background:var(--card);border-radius:14px;width:100%;max-width:420px;
  border:1px solid var(--border);box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden;}
.sm-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.sm-num{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;color:#fff;flex-shrink:0;}
.sm-info{flex:1;}
.sm-title{font-size:1rem;font-weight:800;}
.sm-loc{font-size:.75rem;color:var(--text2);margin-top:2px;}
.sm-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.sm-body{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.sm-row{display:flex;align-items:center;gap:10px;}
.sm-icon{font-size:1.2rem;flex-shrink:0;width:28px;text-align:center;}
.sm-detail{flex:1;}
.sm-lbl{font-size:.72rem;font-weight:700;color:var(--text);}
.sm-val{font-size:.68rem;color:var(--text2);margin-top:1px;}
.sm-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:auto;}
.sm-badge.ok   {background:var(--green-bg,#d4f0e0);color:#15803d;border:1px solid #80c8a0;}
.sm-badge.err  {background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;}
.sm-badge.warn {background:#fff7ed;color:#c2410c;border:1px solid #fdba74;}
.sm-badge.info {background:var(--bg2);color:var(--text3);border:1px solid var(--border);}
.sm-badge.blue {background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd;}
.sm-sep{height:1px;background:var(--border);margin:2px 0;}
.sm-panic-alert{
  background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;
  padding:10px 12px;display:flex;align-items:center;gap:10px;
}
.sm-panic-icon{font-size:1.4rem;animation:pp .7s ease-in-out infinite;}
.sm-panic-txt{flex:1;}
.sm-panic-tipo{font-size:.8rem;font-weight:800;color:#dc2626;}
.sm-panic-ts{font-size:.68rem;color:#b91c1c;margin-top:2px;}
.sm-footer{padding:10px 18px 14px;border-top:1px solid var(--border);display:flex;gap:8px;}
.sm-btn{flex:1;padding:9px;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;text-align:center;text-decoration:none;display:block;}
.sm-btn.dark{background:#2a2a2a;color:#fff;}
.sm-btn.out{background:var(--bg2);color:var(--text2);border:1px solid var(--border);}
.sm-btn.red{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;}
.sm-btn.wa{background:#25d366;color:#fff;flex:1.6;}
.pb{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:900;color:#fff;z-index:2;border:2px solid var(--bg);}
.pb.err{background:#ef4444;animation:pp .7s ease-in-out infinite;}
.pb.warn{background:#f97316;animation:pw 1.2s ease-in-out infinite;}
.pb.yl{background:#f59e0b;animation:pw 1.4s ease-in-out infinite;}
@keyframes pp{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 6px rgba(239,68,68,.4);}}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}50%{box-shadow:0 0 0 5px rgba(249,115,22,.35);}}
.fila-tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#d97706;color:#fff;font-size:.6rem;font-weight:900;padding:2px 7px;border-radius:99px;white-space:nowrap;z-index:2;border:1.5px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.prob-list{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
.prob-item{background:var(--card);border:1.5px solid #fca5a5;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.prob-item:hover,.prob-item:focus{transform:translateY(-1px);box-shadow:0 4px 14px rgba(220,38,38,.18);outline:none;border-color:#ef4444;}
.prob-tipo{font-size:1.3rem;flex-shrink:0;}
.prob-info{flex:1;}
.prob-sec{font-weight:800;font-size:.92rem;}
.prob-loc{font-size:.72rem;color:var(--text2);margin-top:2px;}
.prob-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;}
.pb-energia{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;}
.pb-urna-prob{background:#fff7ed;color:#c2410c;border:1px solid #fdba74;}
.pb-mesa{background:#fffbf0;color:#92400e;border:1px solid #fcd34d;}
.pb-atraso{background:#fff7ed;color:#b45309;border:1px solid #fcd34d;}
.prob-ts{font-size:.62rem;color:var(--text3);}
.prob-empty{text-align:center;padding:48px 20px;color:var(--text3);}
.ticker{height:28px;flex-shrink:0;background:#1e1b2e;display:flex;align-items:center;overflow:hidden;border-top:1px solid #2a2840;}
.ticker-label{background:#2d50a0;color:#fff;font-size:.65rem;font-weight:800;padding:0 12px;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;letter-spacing:.06em;}
.ticker-wrap{flex:1;overflow:hidden;position:relative;}
.ticker-inner{display:flex;gap:0;white-space:nowrap;animation:ticker-scroll 40s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
.ticker-item{display:inline-flex;align-items:center;gap:6px;padding:0 24px 0 0;font-size:.68rem;font-weight:600;color:#a0a0c0;}
.ticker-item.ti-prob{color:#f87171;}
.ticker-item.ti-fila{color:#fbbf24;}
.ticker-item.ti-enc{color:#60a5fa;}
.ticker-item.ti-urna{color:#4ade80;}
.ticker-item.ti-atraso{color:#fb923c;}
.ticker-sep{color:#2a2840;padding:0 4px;}
@keyframes ticker-scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* ── PAINEL DE SONS ── */
.gear-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.82rem;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.gear-btn:hover{background:var(--border);}
.sound-overlay{position:fixed;inset:0;background:rgba(30,27,46,.55);z-index:50;display:flex;align-items:flex-end;justify-content:flex-end;padding:12px;opacity:0;pointer-events:none;transition:opacity .2s;}
.sound-overlay.open{opacity:1;pointer-events:all;}
.sound-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;width:360px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22);display:flex;flex-direction:column;}
.sp-hdr{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sp-title{font-size:.9rem;font-weight:800;}
.sp-close{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.sp-body{padding:14px 16px;display:flex;flex-direction:column;gap:16px;}
.sp-cat{display:flex;flex-direction:column;gap:8px;}
.sp-cat-title{font-size:.72rem;font-weight:800;display:flex;align-items:center;gap:6px;}
.sp-cat-sub{font-size:.65rem;color:var(--text2);}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.preset-btn{padding:8px 4px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.7rem;font-weight:700;text-align:center;transition:all .15s;color:var(--text2);}
.preset-btn:hover{background:var(--bg3);}
.preset-btn.sel{border-color:var(--blue);background:var(--blue-bg,#dde7f5);color:var(--blue);}
.preset-preview{display:flex;align-items:center;gap:3px;}
.preset-preview .pp-play{font-size:.65rem;margin-right:2px;}
.upload-row{display:flex;gap:8px;align-items:center;}
.upload-btn{flex:1;padding:7px 10px;border-radius:8px;border:1.5px dashed var(--border);background:var(--bg2);cursor:pointer;font-size:.7rem;font-weight:600;color:var(--text2);text-align:center;transition:all .15s;}
.upload-btn:hover{border-color:var(--blue);color:var(--blue);}
.upload-clear{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.68rem;color:var(--text2);}
.upload-name{font-size:.62rem;color:var(--arc-done,#16a34a);font-weight:700;margin-top:2px;}
.vol-row{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--text2);}
.vol-row input[type=range]{flex:1;accent-color:var(--blue);}
.sp-footer{padding:10px 16px;border-top:1px solid var(--border);}
.sp-mute{width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.78rem;font-weight:700;color:var(--text2);transition:all .15s;}
.sp-mute.muted{background:#fef2f2;border-color:#fca5a5;color:#dc2626;}
.sp-test{width:100%;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.72rem;font-weight:700;color:var(--text2);margin-top:6px;}
.nav{height:36px;flex-shrink:0;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;}
.nav-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.nav-btn:hover{background:var(--border);}
.pdots{display:flex;gap:5px;}
.pdot{width:9px;height:9px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all .2s;}
.pdot.act{transform:scale(1.2);}
.pg-label{font-size:.7rem;font-weight:700;color:var(--text2);min-width:160px;text-align:center;}
.cd-wrap{flex:1;display:flex;align-items:center;gap:7px;}
.cd-track{flex:1;height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;}
.cd-fill{height:100%;border-radius:99px;background:var(--blue);transition:width 1s linear;}
.cd-num{font-size:.62rem;font-weight:700;color:var(--text3);min-width:24px;text-align:right;}
.pause-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:.78rem;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.d-inp-wrap{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--text2);}
.d-inp-wrap input{width:38px;padding:2px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);font-size:.65rem;text-align:center;}
.v-leg{display:flex;gap:9px;}
.vli{display:flex;align-items:center;gap:3px;font-size:.58rem;color:var(--text3);}
.vlid{width:6px;height:6px;border-radius:50%;}

</style>
</head>
<body>
<div class="topbar">
  <div class="t-logo">SIME</div><div class="t-sep"></div>
  <div class="t-title">TV Dia da Eleição</div><div class="t-sep"></div>
  <div class="t-stats" id="t-stats"></div>
  <div class="t-right">
    <div class="t-clock" id="clock">--:--:--</div>
    <button class="gear-btn" onclick="toggleSoundPanel()" title="Configurar sons de alerta">⚙️</button>
  </div>
</div>

<!-- MODAL DETALHE DA SEÇÃO -->
<div class="sec-overlay" id="sec-overlay" onclick="closeSecModal(event)">
  <div class="sec-modal" id="sec-modal"></div>
</div>

<!-- PAINEL DE SONS -->
<div class="sound-overlay" id="sound-overlay" onclick="closeSoundPanelIfOut(event)">
  <div class="sound-panel" id="sound-panel">
    <div class="sp-hdr">
      <div class="sp-title">🔊 Sons de alerta</div>
      <button class="sp-close" onclick="toggleSoundPanel()">✕</button>
    </div>
    <div class="sp-body">

      <!-- PÂNICO -->
      <div class="sp-cat">
        <div class="sp-cat-title"><span>🚨</span> Pânico</div>
        <div class="sp-cat-sub">Falta de energia · Problema na urna</div>
        <div class="preset-grid" id="presets-panico"></div>
        <div class="upload-row">
          <label class="upload-btn" for="upload-panico">📁 Carregar arquivo .mp3 / .wav</label>
          <input type="file" id="upload-panico" accept="audio/*" style="display:none" onchange="uploadSound('panico',this)">
          <button class="upload-clear" onclick="clearUpload('panico')" title="Remover arquivo">✕</button>
        </div>
        <div id="upload-name-panico" class="upload-name" style="display:none"></div>
        <div class="vol-row">
          🔉 <input type="range" id="vol-panico" min="0" max="100" value="80" oninput="updateVol('panico',this.value)">
          <span id="vol-panico-val">80%</span>
        </div>
      </div>

      <!-- AVISO -->
      <div class="sp-cat">
        <div class="sp-cat-title"><span>⚠️</span> Aviso</div>
        <div class="sp-cat-sub">Mesa incompleta · Votação atrasada</div>
        <div class="preset-grid" id="presets-aviso"></div>
        <div class="upload-row">
          <label class="upload-btn" for="upload-aviso">📁 Carregar arquivo .mp3 / .wav</label>
          <input type="file" id="upload-aviso" accept="audio/*" style="display:none" onchange="uploadSound('aviso',this)">
          <button class="upload-clear" onclick="clearUpload('aviso')" title="Remover arquivo">✕</button>
        </div>
        <div id="upload-name-aviso" class="upload-name" style="display:none"></div>
        <div class="vol-row">
          🔉 <input type="range" id="vol-aviso" min="0" max="100" value="60" oninput="updateVol('aviso',this.value)">
          <span id="vol-aviso-val">60%</span>
        </div>
      </div>

    </div>
    <div class="sp-footer">
      <button class="sp-mute" id="mute-btn" onclick="toggleMute()">🔇 Silenciar todos os alertas</button>
      <button class="sp-test" onclick="testBothSounds()">▶ Testar os dois sons</button>
    </div>
  </div>
</div>
<div class="fase-bar">
  <button class="fase-btn active ab"  id="fase-ab"   onclick="setFase('ab')">🌅 Abertura</button>
  <button class="fase-btn enc"        id="fase-enc"  onclick="setFase('enc')">🏁 Encerramento</button>
  <button class="fase-btn prob"       id="fase-prob" onclick="setFase('prob')">⚠ Problemas</button>
  <div class="fase-info" id="fase-info">4 arcos: chegou · completa · zerésima · votação</div>
  <div class="switch-wrap">
    <span>Trocar enc. às</span>
    <input type="time" id="auto-switch" value="17:00">
    <span class="auto-label auto-off" id="auto-lbl">Auto</span>
  </div>
</div>

<div class="content" id="content"></div>
<div class="ticker">
  <div class="ticker-label">📡 AO VIVO</div>
  <div class="ticker-wrap"><div class="ticker-inner" id="ticker-inner"><span class="ticker-item">Aguardando eventos...</span></div></div>
</div>

// Preenchido pelo Admin ao provisionar esta TV.
import { SIME_CONFIG } from './sime_config.js';
const CITIES_CACHE_KEY = 'sime_tv_cities_v1';

(async () => {
  const { client } = await bootstrapTvSession(SIME_CONFIG);
  if (!client) return; // sem token de TV configurado ainda — segue no fallback local
  initSimeDados(client);

  // CITIES: NUMPAGES e os pontos de paginação são montados uma única vez no
  // carregamento — troca via cache+reload (mesmo padrão de SIME_tv_vespera.html).
  await atualizarCacheTv(CITIES_CACHE_KEY, async () => {
    const secoes = await getSecoes({ fallback: null });
    return secoes ? agruparSecoesPorCidade(secoes) : null;
  });

  // Realtime: snapshot inicial de sime_mesa_estado + assinatura pra refletir
  // qualquer mudança quase instantaneamente (em vez de esperar o próximo
  // ciclo de 5s de buildPages()). loadMesa() abaixo passa a preferir esse
  // cache remoto quando ele existe — sem sessão, cai no fallback local
  // (localStorage) automaticamente, como antes.
  const secoesParaMesa = await getSecoes({ fallback: null });

  const mesaInicial = await getMesaEstadoMap({ fallback: null });
  let rerenderTimer = null;
  function agendarRerender() {
    clearTimeout(rerenderTimer);
    rerenderTimer = setTimeout(() => { if (window.buildPages) window.buildPages(); }, 300);
  }
  if (mesaInicial) {
    window.__mesaRemota = mesaInicial;
    agendarRerender();

    if (numero == null) return;
    if (!window.__mesaRemota) window.__mesaRemota = {};
    window.__mesaRemota[String(numero).padStart(4, '0')] = mapMesaEstadoRow(row);
    agendarRerender();
  });

  // está naquela seção. Cai em silêncio se não vier nada: o botão some e o
  // resto do painel continua igual — a TV nunca deve travar por causa disso.
  try {
    const atores = await getAtores({ fallback: [] });
    const porSecao = {};
    for (const a of atores || []) {
      if (!a.ativo || !a.secao || !a.telefone) continue;
      if (!porSecao[a.secao]) porSecao[a.secao] = [];
      porSecao[a.secao].push({ nome: a.nome, telefone: a.telefone, funcao_mesa: a.funcao_mesa, funcao: a.funcao });
    }
    window.__contatosPorSecao = porSecao;
  } catch (e) { /* sem contatos — o modal simplesmente não mostra o botão */ }
})();

function buildPresetGrid(cat,presets){
  const el=document.getElementById('presets-'+cat);
  el.innerHTML=presets.map(p=>`

function selectPreset(cat,preset){

  sonsCfg[cat].custom=null;

  buildPresetGrid(cat,cat==='panico'?PANICO_PRESETS:AVISO_PRESETS);
  document.getElementById('upload-name-'+cat).style.display='none';
  tocarSom(cat);  // preview

function updateVol(cat,v){

function uploadSound(cat,input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();

    sonsCfg[cat].preset=null;

    buildPresetGrid(cat,cat==='panico'?PANICO_PRESETS:AVISO_PRESETS);

    nm.textContent='✓ '+file.name; nm.style.display='block';

// ── CONTATO DA MESA ────────────────────────────────────────
// Quem ligar quando a seção tem problema. A ordem é a da mesa: o Presidente
// responde pela seção; os outros são o plano B de quem não atende.
//
// O filtro por funcao==='mesario' não é redundante — a junta eleitoral também
// tem gente com funcao_mesa='Presidente', e ligar pra ela por causa de uma
// urna com defeito seria escalar para o lugar errado.
const ORDEM_MESA = ['Presidente', '1º Mesário', '2º Mesário', '1º Secretário'];
function contatoDaSecao(n){
  const lista = (window.__contatosPorSecao || {})[n] || [];
  const mesarios = lista.filter(c => c.funcao === 'mesario' && c.telefone);
  if (!mesarios.length) return null;
  mesarios.sort((a,b) => {
    const ia = ORDEM_MESA.indexOf(a.funcao_mesa), ib = ORDEM_MESA.indexOf(b.funcao_mesa);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return mesarios[0];
}

// Mensagem já escrita: às 5h30, com o telão apitando, ninguém quer redigir.
function msgContato(n, problema){
  return `SIME — Seção ${parseInt(n)}\n${problema}\n\nAqui é o cartório. Pode nos atualizar sobre a situação?`;
}

function botaoContatoHtml(n, problema){
  const c = contatoDaSecao(n);
  if (!c) return '';
  const href = linkWhatsApp(c.telefone, msgContato(n, problema));
  if (!href) return '';
  const papel = c.funcao_mesa || 'Mesário';
  return `<a class="sm-btn wa" href="${href}" target="_blank" rel="noopener">💬 ${papel}: ${c.nome.split(' ')[0]} · ${fmtTelefone(c.telefone)}</a>`;
}

function mkUrnaBar(states){
  const total=states.length;
  const recolhidas=states.filter(st=>st.urna||st.urna_cartorio).length;
  const cartorio  =states.filter(st=>st.urna_cartorio).length;
  const pctRec =total>0?Math.round(recolhidas/total*100):0;
  const pctCar =total>0?Math.round(cartorio/total*100):0;
  // Cores: azul = saiu com motorista, verde = no cartório
  const recColor = recolhidas===total ? '#2563eb' : '#93c5fd';
  const carColor = cartorio===total   ? '#16a34a' : '#4ade80';
  return `<div class="urna-bar-wrap">
    <div class="urna-bar-row">
      <div class="urna-bar-lbl">🚗 Recolhidas</div>
      <div class="urna-bar-track"><div class="urna-bar-fill" style="width:${pctRec}%;background:${recColor}"></div></div>
      <div class="urna-bar-count" style="color:${recColor}">${recolhidas}/${total}</div>
    </div>
    <div class="urna-bar-row">
      <div class="urna-bar-lbl">📦 No cartório</div>
      <div class="urna-bar-track"><div class="urna-bar-fill" style="width:${pctCar}%;background:${carColor}"></div></div>

  </div>`;
}

        const stJson=JSON.stringify(st).replace(/"/g,'&quot;');
        circs+=`<div class="sw${gone}${panic||st.fila>0?' has-issue':''}" onclick="openSecModal('${n}',JSON.parse(this.dataset.st))" data-st="${stJson}">${mkSVG(n,st,faseAtual)}${badge}${filaBadge}${tipHtml}</div>`;});box.innerHTML=`<div class="loc-name">${loc.n}</div><div class="loc-status ${stCls}">${stTxt}</div>${faseAtual==='enc'?mkUrnaBar(states):''}${faseAtual==='enc'?`<div class="loc-circles" style="margin-top:4px">${circs}</div>`:`<div class="loc-circles">${circs}</div>`}`;grid.appendChild(box);});div.appendChild(grid);content.appendChild(div);});updateStats(totVot,totEnc,totUrna,totCar,totProb,totAtrV,totAtrM,total);}
function buildProbView(mesa,nm,limMesa,limVot){_acess=loadAcess();const content=document.getElementById('content');const div=document.createElement('div');div.className='v-page active';const list=document.createElement('div');list.className='prob-list';const items=[];CITIES.forEach(city=>city.locs.forEach(loc=>loc.s.forEach(n=>{const st=getSt(n,mesa);const panic_e=st.panico?.energia&&!st.panico_resolved?.energia;const panic_u=st.panico?.urnaprob&&!st.panico_resolved?.urnaprob;const atrV=nm>=limVot&&!st.vot&&!st.enc;const atrM=nm>=limMesa&&Object.values(st.mesa||{}).filter(v=>v>=1).length<4&&!st.vot;if(panic_e)items.push({tipo:'⚡',badge:'pb-energia',label:'Falta de energia',n,loc:loc.n,ts:getProbTs('panico:e:'+n)});if(panic_u)items.push({tipo:'🖥️',badge:'pb-urna-prob',label:'Problema na urna',n,loc:loc.n,ts:getProbTs('panico:u:'+n)});if(atrV){registerProb('atr:v:'+n);items.push({tipo:'⏱',badge:'pb-atraso',label:'Votação não iniciada',n,loc:loc.n,ts:getProbTs('atr:v:'+n)});}else clearProbTs('atr:v:'+n);if(atrM){registerProb('atr:m:'+n);items.push({tipo:'👥',badge:'pb-mesa',label:'Mesa incompleta',n,loc:loc.n,ts:getProbTs('atr:m:'+n)});}else clearProbTs('atr:m:'+n);})));if(!items.length){list.innerHTML='<div class="prob-empty"><div style="font-size:2.5rem;margin-bottom:10px">✅</div><div style="font-size:.85rem;font-weight:700;color:var(--text2)">Nenhum problema ativo</div></div>';}else{items.forEach(p=>{const row=document.createElement('div');row.className='prob-item';row.tabIndex=0;row.title='Ver detalhe e contato da seção';row.innerHTML=`<div class="prob-tipo">${p.tipo}</div><div class="prob-info"><div class="prob-sec">Seção ${parseInt(p.n)}</div><div class="prob-loc">${p.loc}</div></div><span class="prob-badge ${p.badge}">${p.label}</span><div class="prob-ts" title="Detectado às ${p.ts}">desde ${p.ts}</div>`;row.onclick=()=>openSecModal(p.n,getSt(p.n,loadMesa()));row.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}};list.appendChild(row);});}div.appendChild(list);content.appendChild(div);document.getElementById('t-stats').innerHTML=items.length?`<span class="ts" style="color:#ef4444"><div class="tsd" style="background:#ef4444"></div>${items.length} problema${items.length>1?'s':''}</span>`:`<span class="ts" style="color:#16a34a"><div class="tsd" style="background:#16a34a"></div>Sem problemas</span>`;}
function updateStats(totVot,totEnc,totUrna,totCar,totProb,totAtrV,totAtrM,total){const el=document.getElementById('t-stats');if(faseAtual==='ab'){el.innerHTML=[totVot?`<span class="ts" style="color:#16a34a"><div class="tsd" style="background:#16a34a"></div>${totVot} votando</span>`:'',totAtrV?`<span class="ts" style="color:#f59e0b"><div class="tsd" style="background:#f59e0b"></div>${totAtrV} atraso vot.</span>`:'',totAtrM?`<span class="ts" style="color:#d97706"><div class="tsd" style="background:#d97706"></div>${totAtrM} mesa inc.</span>`:'',totProb?`<span class="ts" style="color:#ef4444"><div class="tsd" style="background:#ef4444"></div>${totProb} problemas</span>`:'',`<span class="ts" style="color:var(--text3)">${total} total</span>`].join('');}else{el.innerHTML=[totCar?`<span class="ts" style="color:#16a34a"><div class="tsd" style="background:#16a34a"></div>${totCar} no cartório</span>`:'',totUrna-totCar>0?`<span class="ts" style="color:#2563eb"><div class="tsd" style="background:#2563eb"></div>${totUrna-totCar} a caminho</span>`:'',totEnc?`<span class="ts" style="color:#3b82f6"><div class="tsd" style="background:#3b82f6"></div>${totEnc} encerradas</span>`:'',totProb?`<span class="ts" style="color:#ef4444"><div class="tsd" style="background:#ef4444"></div>${totProb} problemas</span>`:'',`<span class="ts" style="color:var(--text3)">${total} total</span>`].join('');}}
function renderCurrent(){document.querySelectorAll('.v-page').forEach((p,i)=>p.classList.toggle('active',i===curPage));}
function goPage(idx){curPage=((idx%NUMPAGES)+NUMPAGES)%NUMPAGES;vCd=rotDelay;updateCountdown();renderCurrent();updateNav();}
function updateNav(){const dots=document.getElementById('v-dots');dots.innerHTML='';CITIES.forEach((c,i)=>{const d=document.createElement('div');d.className='pdot'+(i===curPage?' act':'');d.style.borderColor=i===curPage?c.color:'';d.style.background=i===curPage?c.color:'';d.onclick=()=>goPage(i);d.title=c.city;dots.appendChild(d);});document.getElementById('v-pg-label').textContent=faseAtual==='prob'?'Todos os problemas':`${CITIES[curPage]?.city}  ·  ${curPage+1}/${NUMPAGES}`;document.getElementById('v-pg-label').style.color=faseAtual==='prob'?'#dc2626':CITIES[curPage]?.color||'var(--text2)';}
function updateCountdown(){const pct=(vCd/rotDelay)*100;const f=document.getElementById('v-cdfill');f.style.width=Math.max(0,pct)+'%';f.style.background=vCd<=3?'#ef4444':vCd<=5?'#f59e0b':'var(--blue)';document.getElementById('v-cdnum').textContent=vCd+'s';}
function vSetDelay(v){rotDelay=Math.max(3,Math.min(60,v));vCd=rotDelay;startTicker();}
function vTogglePause(){vPaused=!vPaused;document.getElementById('v-pause').textContent=vPaused?'▶':'⏸';}
function startTicker(){clearInterval(vTicker);vTicker=setInterval(()=>{if(vPaused||faseAtual==='prob')return;vCd--;updateCountdown();if(vCd<=0){goPage(curPage+1);vCd=rotDelay;}},1000);}
function updateLeg(){const leg=document.getElementById('v-leg');if(faseAtual==='ab'){leg.innerHTML='<div class="vli"><div class="vlid" style="background:#dc2626"></div>Ninguém</div><div class="vli"><div class="vlid" style="background:#d97706"></div>Incompleta</div><div class="vli"><div class="vlid" style="background:#f59e0b"></div>Completa</div><div class="vli"><div class="vlid" style="background:#84cc16"></div>Zerésima</div><div class="vli"><div class="vlid" style="background:#16a34a"></div>Votando</div><div class="vli"><div class="vlid" style="background:#ef4444"></div>Problema</div>';}else if(faseAtual==='enc'){leg.innerHTML='<div class="vli"><div class="vlid" style="background:#94a3b8"></div>Votando</div><div class="vli"><div class="vlid" style="background:#f59e0b"></div>Fila (badge=qtd)</div><div class="vli"><div class="vlid" style="background:#3b82f6"></div>Encerrada</div><div class="vli"><div class="vlid" style="background:#2563eb"></div>Urna saiu</div><div class="vli"><div class="vlid" style="background:#16a34a"></div>No cartório</div>';}else{leg.innerHTML='<div class="vli">⚡ <span>Falta de energia</span></div><div class="vli">🖥️ <span>Problema na urna</span></div><div class="vli">⏱ <span>Votação não iniciada</span></div><div class="vli">👥 <span>Mesa incompleta</span></div><div class="vli" style="color:var(--text3)">· clique para ver e contatar</div>';}}
iniciarRelogio('clock', { comSegundos: true, intervaloMs: 1000 });
updateLeg();buildPages();renderCurrent();updateNav();startTicker();
setInterval(()=>{buildPages();renderCurrent();checkAutoSwitch();},5000);
document.addEventListener('click',()=>initAudio(),{once:true});


</script>
</body>
